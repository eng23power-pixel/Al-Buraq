<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفريات</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
        Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
    }
    p {
      max-width: 500px;
      margin: 16px;
      line-height: 1.6;
    }
    button {
      border: 1px solid #555;
      background: #222;
      color: #eee;
      font-size: 16px;
      padding: 12px 24px;
      margin-top: 24px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>📶 غير متصل بالإنترنت</h1>
  <p>عذراً، يبدو أنك غير متصل بالشبكة حالياً. يرجى التحقق من اتصالك والمحاولة مجدداً.</p>
  <button onclick="location.reload()">إعادة التحميل</button>
</body>
</html>
