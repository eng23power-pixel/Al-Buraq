function openAssistant(seed){
  if(!Helper.log.length) Helper.log.push({me:false,t:Helper.greeting(),acts:[]});
  openModal(`<h3>🤖 ${T('ai.title','مساعد البُراق الذكي')}</h3>
  <div class="t2" style="font-size:calc(10px*var(--fs));margin-bottom:8px">${T('ai.sub','متاح دائماً · يجيبك بلغتك · يساعدك خطوة بخطوة')}</div>
  <div id="ai-body" style="max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0"></div>
  <div id="ai-chips" style="display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none"></div>
  <div style="display:flex;gap:6px;align-items:flex-end">
    <textarea class="input" id="ai-in" rows="1" placeholder="${T('ai.ph','اكتب سؤالك بأي لغة…')}" style="resize:none;flex:1"></textarea>
    <button class="btn btn-primary" style="padding:12px 14px" onclick="aiSend()">⬆️</button>
  </div>
  <div class="muted" style="font-size:calc(8.5px*var(--fs));margin-top:6px">${T('ai.disc','مساعد آلي — للحالات الطارئة استخدم زر SOS أو تواصل مع الإدارة.')}</div>`);
  aiPaint();
  const inp=document.getElementById('ai-in');
  if(inp){ inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); aiSend(); } }); setTimeout(()=>inp.focus(),300); }
  if(seed) aiSend(seed);
}
function aiPaint(){
  const b=document.getElementById('ai-body'); if(!b) return;
  b.innerHTML=Helper.log.map((m,i)=>{
    const mine=m.me;
    const acts=(m.acts||[]).map(([lab,cmd])=>`<button class="btn btn-ghost btn-sm" style="margin:3px 3px 0 0" onclick="aiAct('${cmd}')">${lab}</button>`).join('');
    return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:88%">
      <div style="background:${mine?'var(--gold)':'var(--bg-2)'};color:${mine?'#0B192C':'var(--text)'};border:1px solid var(--border);
        border-radius:${mine?'14px 14px 4px 14px':'14px 14px 14px 4px'};padding:9px 11px;font-size:calc(11.5px*var(--fs));line-height:1.65;white-space:pre-wrap">${m.t}</div>
      ${acts?`<div>${acts}</div>`:''}</div>`;
  }).join('') + (Helper.busy?`<div class="muted" style="font-size:calc(10px*var(--fs))">⏳ ${T('ai.think','أفكر…')}</div>`:'');
  b.scrollTop=b.scrollHeight;
  const c=document.getElementById('ai-chips');
  if(c) c.innerHTML=Helper.chips().map(([lab,q])=>`<button class="btn btn-ghost btn-sm" style="white-space:nowrap;flex:0 0 auto" onclick="aiSend(${JSON.stringify(q).replace(/"/g,'&quot;')})">${lab}</button>`).join('');
  try{ translateDOM(document.getElementById('ov')||document); }catch(e){}
}
async function aiSend(forced){
  const inp=document.getElementById('ai-in');
  const q=String(forced!==undefined?forced:((inp&&inp.value)||'')).trim();
  if(!q) return;
  if(inp&&forced===undefined) inp.value='';
  Helper.log.push({me:true,t:q}); Helper.busy=true; aiPaint();
  let ans, acts=[];
  const hit=Helper.match(q);
  if(hit){ const r=hit.a(); ans=r.text; acts=r.acts||[]; }
  else {
    // 🧠 سؤال حرّ: اسأل خادم الذكاء الاصطناعي (Gemini عبر خادم الترخيص) أو AI_API_URL إن وُضع
    if(CONFIG.AI_API_URL){
      try{
        const r=await fetch(CONFIG.AI_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({q, lang:curLang(), app:CONFIG.APP_NAME, version:APP_VERSION})});
        const j=await r.json(); ans=(j.answer||j.text||'').trim();
      }catch(e){}
    }
    if(!ans && CONFIG.LICENSE_URL){
      try{ const t=await AI.ask('support',{q, lang:curLang(), role:S.role, version:APP_VERSION});
        if(t && !/غير متصل/.test(t)) ans=t; }catch(e){}
    }
  }
  if(!ans){ ans='لم أفهم سؤالك تماماً 🤔 جرّب صياغة أقصر، أو اختر أحد الأزرار أدناه — وإن كان الأمر عاجلاً تواصل مع الإدارة مباشرة.';
    acts=[['💰 الأسعار','ask:كم سعر الرحلة'],['🚗 الحجز','ask:كيف اطلب سيارة'],['📞 تواصل مع الإدارة','act:openUserGuide']]; }
  // 🌐 ترجمة الجواب تلقائياً لغة المستخدم
  const lg=curLang();
  if(lg!=='ar'){
    Helper.cache=Helper.cache||{};
    const ck=lg+'|'+ans.slice(0,120);
    if(Helper.cache[ck]) ans=Helper.cache[ck];
    else{ try{ const tr=await autoTranslate(ans, lg); if(tr){ Helper.cache[ck]=tr; ans=tr; } }catch(e){} }
  }
  Helper.busy=false; Helper.log.push({me:false,t:ans,acts}); aiPaint();
  try{ notifyFx('msg'); }catch(e){}
}
function aiAct(cmd){
  const [k,v]=String(cmd).split(':');
  if(k==='ask'){ aiSend(v); return; }
  if(k==='tab'){ closeModal(); S.role='PASSENGER'; S.tab=+v; saveState(); render(); return; }
  if(k==='svc'){ closeModal(); S.role='PASSENGER'; S.tab=0; if(typeof setServiceMode==='function') setServiceMode(v); else { S.serviceMode=v; saveState(); render(); } return; }
  if(k==='act'){ closeModal(); setTimeout(()=>{ try{ (window[v])&&window[v](); }catch(e){ toast('غير متاح الآن','err'); } },280); return; }
}
function mountAssistantFab(){
  const old=document.querySelector('.fab-ai'); if(old) old.remove();
  if(MOD('ai')===false) return;
  const b=document.createElement('button'); b.className='fab-ai'; b.innerHTML='🤖';
  b.title='مساعد البُراق الذكي'; b.setAttribute('aria-label','مساعد البُراق الذكي');
  b.onclick=()=>openAssistant(); document.body.appendChild(b);
}

  host.innerHTML=`<div class="modal-overlay" id="ov"><div class="modal"><div class="modal-grip"></div>${html}</div></div>`;
  const ov=document.getElementById('ov');
  requestAnimationFrame(()=>ov.classList.add('show'));
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  try{ translateDOM(host); setTimeout(()=>translateDOM(host),350); }catch(e){} // 🌐 ترجمة النوافذ
}
function closeModal(){
  const ov=document.getElementById('ov');
  if(ov){
    ov.classList.remove('show');
    const gen=_modalGen;
    setTimeout(()=>{ if(gen===_modalGen) document.getElementById('modal-host').innerHTML=''; },260);
  }
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML = Topbar() + `<div class="wrap fade-in" id="page">${Page()}</div>` + BottomNav();
  try{ translateDOM(); }catch(e){} // 🌐 المترجم الشامل لكل الصفحات
  try{ installI18nObserver(); }catch(e){}
  // SOS FAB أثناء التتبع للمسافر/السائق
  const old=document.querySelector('.fab-sos'); if(old) old.remove();
  if((S.role==='PASSENGER'||S.role==='DRIVER') && S.tab===1){
    const fab=document.createElement('button'); fab.className='fab-sos'; fab.textContent='SOS';
    fab.onclick=triggerSOS; document.body.appendChild(fab);
    // Initialize real Leaflet map
    initLiveMap();
  }
  // خريطة وضع التكسي (تبويب الحجز، خدمة تكسي)
  if(S.role==='PASSENGER' && S.tab===0 && ['taxi','moto'].includes(S.serviceMode||'line')){
    initTaxiMap();
  }
  try{ mountAssistantFab(); }catch(e){}   // 🤖 المساعد الذكي — متاح دائماً
  bindTopbar();
}
function initTaxiMap(){
  const el=document.getElementById('live-map'); if(!el) return;
  el.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-2);font-size:calc(12px*var(--fs))">🗺️ جارٍ تحميل الخريطة…</div>`;
  whenMapReady(el, ()=>{
    const fallback={lat:33.3152,lng:44.3661}; // بغداد افتراضياً
    const start=Taximeter.lastPos||GPS.currentPos||fallback;
    const pi=(typeof pickupInfo==='function')&&pickupInfo();
    const base=pi?{lat:pi.lat,lng:pi.lng}:start;
    const m=MapEngine.init('live-map', base, 13);
    if(!m) return;
    MapEngine.addMarker('me', base.lat, base.lng, '📍','نقطة انطلاقك');
    try{
      const r=myRide();
      const dest=(r&&r.to)||S.taxiTo;
      if(dest&&dest.lat) MapEngine.addMarker('dest', dest.lat, dest.lng, '🎯', dest.label||dest.name||'الوجهة');
      // 🚖 الكباتن القريبون على الخريطة
      const acc=r&&r.driverId?S.drivers.find(x=>x.id===r.driverId):null;
      const list=acc?[{d:acc,km:0,approx:driverLoc(acc).approx}]:nearestCaptains(base,6);
      list.forEach((n,i)=>{ const L=driverLoc(n.d);
        const ic=(n.d.carStyle&&n.d.carStyle.icon)||'🚖';
        MapEngine.addMarker('cap'+i, L.lat, L.lng, ic, n.d.name+(L.approx?' (موقع تقريبي)':''));
      });
      try{ drawZones(m); Reports.drawOn(m); }catch(e){}
    }catch(e){}
    if(Taximeter.running && Taximeter.path.length>1) MapEngine.drawPath(Taximeter.path);
    else if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{
      const c={lat:p.coords.latitude,lng:p.coords.longitude};
      MapEngine.moveMarker('me',c.lat,c.lng); if(MapEngine.map) MapEngine.map.panTo([c.lat,c.lng]);
    },()=>{},{enableHighAccuracy:true,timeout:8000});
  });
}
function setTab(i){ if(S.tab===1&&i!==1){ LiveTrack.stop(); } S.tab=i; saveState(); render(); }
function setRole(r){
  if(r==='ADMIN' && !canSeeAdmin()){ toast('هذه الصلاحية للمدير العام فقط','err'); return; }
  if(r==='GARAGE' && !canSeeGarage()){ toast('صلاحية مسؤول الكراج للمدير والشريك فقط','err'); return; }
  if(r==='DRIVER' && !canSwitchDriver()){ toast('صلاحية السائق متاحة للمكاتب والمدير فقط','err'); return; }
  S.role=r; S.tab=0; saveState(); render();
}

          <div class="sub">${S.user.name}</div></div>
      </div>
      <div class="top-actions">
        ${MOD('notices')?`<button class="icon-btn" title="التبليغات" onclick="openNotices()" style="position:relative">🔔${(()=>{const n=(S.notices||[]).filter(x=>x.t>(S.noticesReadT||0)&&noticeForMe(x)).length;return n?`<span class="badge-count" style="position:absolute;top:-4px;inset-inline-end:-4px">${n}</span>`:''})()}</button>`:''}
        <button class="icon-btn" title="بحث عن مكان" onclick="openPlaceSearch()">📍</button>
        <button class="icon-btn" title="اللغة / Language" onclick="openLangModal()">🌐</button>
        <button class="icon-btn" title="تكبير النص لكبار السن" onclick="toggleSenior()">${S.seniorMode?'🔎':'🔍'}</button>
        <button class="icon-btn ${S.lastSync?'live':''}" title="مزامنة سحابية" onclick="manualSync(this)">☁️</button>
      </div>
    </div>
    <div class="role-switch">${roleBtns}</div>
  </div>`;
}
function bindTopbar(){}
function toggleSenior(){ S.seniorMode=!S.seniorMode; document.body.classList.toggle('senior',S.seniorMode); saveState();
  toast(S.seniorMode?'تم تفعيل الوضع المريح لكبار السن (نص وأيقونات أكبر) 👵':'الوضع القياسي','info'); render(); }
async function manualSync(btn){ btn.innerHTML='<span class="loader"></span>'; await Cloud.sync(false); btn.innerHTML='☁️'; render(); }

function BottomNav(){
  const tabs=TABS[S.role];
  const tkey={PASSENGER:'tabsP',DRIVER:'tabsD',GARAGE:'tabsG',ADMIN:'tabsA'}[S.role];
  const pendingDisputes=S.disputes.filter(d=>d.status.includes('محال')).length;
  return `<div class="bottom-nav">`+tabs.map((t,i)=>{
    const badge=(S.role==='ADMIN'&&i===2&&pendingDisputes)?`<span class="badge-count">${pendingDisputes}</span>`:'';
    return `<button class="nav-item ${S.tab===i?'active':''}" onclick="setTab(${i})">${badge}<span class="ni">${ico(t.i,30)}</span>${T(tkey+'.'+i,t.l)}</button>`;
  }).join('')+`</div>`;
}

function Page(){
  if(S.role==='PASSENGER') return [PaxBookings,PaxTracking,Wallet,PaxAI,PaxAccount][S.tab]();
  if(S.role==='DRIVER') return [DriverTrips,PaxTracking,DriverWallet,DriverSafety,PaxAccount][S.tab]();
  if(S.role==='GARAGE') return [GarageDash,GarageFleet,GarageTrips,GarageEarnings,PaxAccount][S.tab]();
  if(S.role==='ADMIN') return [AdminDash,AdminFinance,AdminSettings,AdminFleet,AdminLicense][S.tab]();
}

/* ======================================================================
   📣 التبليغات الرسمية — من الإدارة أو مدير الكراج إلى المستخدمين
   تظهر في جرس 🔔 مع عدّاد غير المقروء + صوت وهزاز عند كل تبليغ جديد
   ====================================================================== */
function noticeForMe(n){
  if(!n.aud||n.aud==='all') return true;
  if(n.aud==='drivers') return S.role==='DRIVER';
  if(n.aud==='passengers') return S.role==='PASSENGER';
  if(n.aud==='garage') return S.role==='GARAGE';
  return true;
}
function openNotices(){
  if(!MOD('notices')){ toast(T('mod.off','التبليغات غير مفعّلة حالياً'),'err'); return; }
  const mine=(S.notices||[]).filter(noticeForMe).sort((a,b)=>b.t-a.t);
  S.noticesReadT=Date.now(); saveState();
  const canSend=isMaster()||isGarageManager();
  openModal(`<h3>📣 التبليغات الرسمية</h3>
  ${canSend?`<button class="btn btn-primary btn-block btn-sm" style="margin-bottom:10px" onclick="openSendNotice()">➕ تبليغ جديد للمستخدمين</button>`:''}
  <div style="max-height:55vh;overflow-y:auto">
  ${mine.length?mine.map(n=>`<div class="card soft" style="margin-bottom:8px;padding:10px;border-inline-start:3px solid var(--${n.kind==='warn'?'red':'gold'})">
    <div class="between"><b style="font-size:calc(12.5px*var(--fs))">${n.kind==='warn'?'⚠️':'📢'} ${n.title}</b>
      ${isMaster()?`<button class="btn btn-ghost btn-sm" style="color:var(--red);padding:2px 8px" onclick="delNotice('${n.id}')">🗑️</button>`:''}</div>
    <div class="t2" style="font-size:calc(11px*var(--fs));margin-top:4px;line-height:1.8">${n.body}</div>
    <div class="muted" style="font-size:calc(9px*var(--fs));margin-top:4px">👤 ${n.by} · ${n.time} · ${n.aud==='all'?'للجميع':n.aud==='drivers'?'للكباتن':n.aud==='passengers'?'للمسافرين':'لمدراء الكراجات'}</div>
  </div>`).join(''):`<div class="card soft" style="text-align:center;color:var(--muted);padding:20px">لا توجد تبليغات حالياً 🔕</div>`}
  </div>`);
}
function openSendNotice(){
  if(!(isMaster()||isGarageManager())){ toast('إرسال التبليغات صلاحية الإدارة','err'); return; }
  openModal(`<h3>📣 تبليغ رسمي جديد</h3>
  <div class="field"><label>العنوان *</label><input class="input" id="nt-title" placeholder="مثال: صيانة مجدولة الليلة"></div>
  <div class="field"><label>نص التبليغ *</label><textarea class="input" id="nt-body" rows="3" placeholder="التفاصيل الدقيقة…"></textarea></div>
  <div class="grid2" style="gap:8px">
    <div class="field"><label>الفئة المستهدفة</label><select class="input" id="nt-aud">
      <option value="all">الجميع</option><option value="passengers">المسافرون فقط</option>
      <option value="drivers">الكباتن فقط</option><option value="garage">مدراء الكراجات</option></select></div>
    <div class="field"><label>النوع</label><select class="input" id="nt-kind">
      <option value="info">📢 إعلان</option><option value="warn">⚠️ تحذير</option></select></div>
  </div>
  <button class="btn btn-primary btn-block" onclick="sendNotice()">📣 نشر التبليغ الآن</button>`);
}
function sendNotice(){
  const title=((document.getElementById('nt-title')||{}).value||'').trim();
  const body=((document.getElementById('nt-body')||{}).value||'').trim();
  if(!title||!body){ toast('أكمل العنوان والنص','err'); return; }
  S.notices=S.notices||[];
  S.notices.unshift({id:uid('NT'),title,body,
    aud:(document.getElementById('nt-aud')||{}).value||'all',
    kind:(document.getElementById('nt-kind')||{}).value||'info',
    by:S.user.name||'الإدارة', time:nowTime(), t:Date.now()});
  saveState(); enqueueSync(); closeModal(); render();
  notifyFx('msg');
  toast('📣 نُشر التبليغ ووصل جرس المستخدمين','ok');
}
function delNotice(id){
  if(!isMaster()){ toast('حذف التبليغات صلاحية المدير العام','err'); return; }
  S.notices=(S.notices||[]).filter(n=>n.id!==id); saveState(); openNotices();
}

'💳 تحويل الأجرة إلى ماستر كارد الكابتن':['💳 Transfer the fare to the captain’s Mastercard','💳 گواستنەوەی کرێ بۆ ماستەرکاردی کاپتن','💳 Ücreti kaptanın Mastercard’ına aktar','💳 انتقال کرایه به مسترکارت کاپیتان','💳 Virement du tarif sur la Mastercard du capitaine','💳 Transferir la tarifa a la Mastercard del capitán'],
'تحويل الأجرة إلى ماستر كارد الكابتن':['Transfer the fare to the captain’s Mastercard','گواستنەوەی کرێ بۆ ماستەرکاردی کاپتن','Ücreti kaptanın Mastercard’ına aktarma','انتقال کرایه به مسترکارت کاپیتان','Virement du tarif sur la Mastercard du capitaine','Transferir la tarifa a la Mastercard del capitán'],
'تحويل الأجرة إلى حساب ماستر كارد الكابتن عبر رقم الهاتف المربوط بالبطاقة، مع إشعار تأكيد واتساب.':['Transfer the fare to the captain’s Mastercard account using the phone number linked to the card, with a WhatsApp confirmation.','گواستنەوەی کرێ بۆ هەژماری ماستەرکاردی کاپتن بە ژمارەی تەلەفۆنی بەستراو بە کارتەکە، لەگەڵ پشتڕاستکردنەوەی واتسئاپ.','Ücreti, karta bağlı telefon numarası üzerinden kaptanın Mastercard hesabına aktarın; WhatsApp onayı ile.','انتقال کرایه به حساب مسترکارت کاپیتان از طریق شماره تلفن متصل به کارت، همراه با تأیید واتساپ.','Virez le tarif sur le compte Mastercard du capitaine via le numéro de téléphone lié à la carte, avec confirmation WhatsApp.','Transfiere la tarifa a la cuenta Mastercard del capitán mediante el número de teléfono vinculado a la tarjeta, con confirmación por WhatsApp.'],
'رقم الهاتف المربوط بماستر كارد الكابتن':['Phone number linked to the captain’s Mastercard','ژمارەی تەلەفۆنی بەستراو بە ماستەرکاردی کاپتن','Kaptanın Mastercard’ına bağlı telefon numarası','شماره تلفن متصل به مسترکارت کاپیتان','Numéro de téléphone lié à la Mastercard du capitaine','Número de teléfono vinculado a la Mastercard del capitán'],
'حوّل الأجرة إلى حساب ماستر كارد الكابتن عبر رقم الهاتف المربوط بالبطاقة أعلاه.':['Transfer the fare to the captain’s Mastercard account using the phone number linked to the card shown above.','کرێیەکە بگوازەرەوە بۆ هەژماری ماستەرکاردی کاپتن بە ژمارەی تەلەفۆنی سەرەوە کە بە کارتەکە بەستراوە.','Ücreti, yukarıdaki karta bağlı telefon numarası üzerinden kaptanın Mastercard hesabına aktarın.','کرایه را از طریق شماره تلفن متصل به کارت که در بالا آمده به حساب مسترکارت کاپیتان منتقل کنید.','Virez le tarif sur le compte Mastercard du capitaine via le numéro de téléphone lié à la carte indiqué ci-dessus.','Transfiere la tarifa a la cuenta Mastercard del capitán mediante el número de teléfono vinculado a la tarjeta mostrado arriba.'],
'يصل المبلغ إلى حساب بطاقته، ويؤكد الكابتن الدفع في التطبيق، ويسدّد منه نسبة المنصّة المسجّلة بذمّته.':['The amount reaches his card account, the captain confirms the payment in the app, and settles the platform’s share recorded against him from it.','بڕەکە دەگاتە هەژماری کارتەکەی، کاپتن پارەدانەکە لە ئەپەکەدا پشتڕاست دەکاتەوە و پشکی پلاتفۆرمی تۆمارکراو لەسەری لێی دەداتەوە.','Tutar kart hesabına ulaşır, kaptan ödemeyi uygulamada onaylar ve kendisine kayıtlı platform payını buradan öder.','مبلغ به حساب کارت او می‌رسد، کاپیتان پرداخت را در برنامه تأیید می‌کند و سهم ثبت‌شده پلتفرم را از آن تسویه می‌کند.','Le montant arrive sur le compte de sa carte, le capitaine confirme le paiement dans l’application et règle la part de la plateforme enregistrée à sa charge.','El importe llega a la cuenta de su tarjeta, el capitán confirma el pago en la app y liquida con él la parte de la plataforma registrada a su cargo.'],
'سدّد الآن بتحويل إلى ماستر كارد أو بقسيمة أو من محفظتك.':['Settle now by Mastercard transfer, by voucher, or from your wallet.','ئێستا بە گواستنەوەی ماستەرکارد یان بە کوپۆن یان لە جزدانەکەت بیدەرەوە.','Şimdi Mastercard transferiyle, kuponla veya cüzdanınızdan ödeyin.','اکنون با انتقال مسترکارت، با کوپن یا از کیف پول خود تسویه کنید.','Réglez maintenant par virement Mastercard, par bon ou depuis votre portefeuille.','Liquida ahora por transferencia Mastercard, con cupón o desde tu monedero.'],

'الأجرة تُحسب حسب أسلوب الفئة (ثابت / بالكيلو / عدّاد / مناطق / شرائح / بالساعة) من البند 1 والأسعار من البند 2.':['Fare is computed by the category method (fixed/per-km/meter/zones/tiers/hourly) from item 1 and prices from item 2.','کرێ بە شێوازی پۆل حیساب دەکرێت (بەند 1 و 2).','Ücret, 1. maddedeki yöntem ve 2. maddedeki fiyatlarla hesaplanır.','کرایه با روش بند ۱ و قیمت‌های بند ۲ محاسبه می‌شود.','Tarif calculé selon la méthode (point 1) et les prix (point 2).','La tarifa se calcula con el método (punto 1) y precios (punto 2).'],
'عمولة المنصّة = الأجرة × نسبة الفئة (البند 3) — وإن حدّدت نسبة خاصة لكابتن معيّن من صفحة الأسطول فهي المقدَّمة.':['Platform commission = fare × category rate (item 3) — a per-captain custom rate from the fleet page takes priority.','کۆمیسیۆن = کرێ × ڕێژە (بەند 3).','Komisyon = ücret × oran (madde 3) — kaptana özel oran önceliklidir.','کمیسیون = کرایه × نرخ (بند ۳) — نرخ ویژه کاپیتان مقدم است.','Commission = tarif × taux (point 3) — le taux par capitaine prime.','Comisión = tarifa × tasa (punto 3) — la tasa por capitán prima.'],
'حصة الكابتن = الأجرة − العمولة الكاملة (ثابتة لا تمسّها الخصومات).':["Captain's share = fare − full commission (fixed; discounts never touch it).",'پشکی کاپتن = کرێ − کۆمیسیۆن.','Kaptan payı = ücret − tam komisyon (indirimler dokunmaz).','سهم کاپیتان = کرایه − کمیسیون کامل.','Part du capitaine = tarif − commission (intacte).','Parte del capitán = tarifa − comisión (intacta).'],
'خصم الوفاء للزبون يُمتَص من عمولة المنصّة فقط.':["Customer loyalty discount is absorbed by the platform commission only.",'داشکاندنی وەفا لە کۆمیسیۆنە.','Sadakat indirimi yalnız komisyondan karşılanır.','تخفیف وفاداری فقط از کمیسیون.','Remise fidélité prise sur la commission seule.','El descuento sale solo de la comisión.'],
'الضريبة ورسوم الخدمة (البند 4) تُقتطعان من العمولة الصافية — عدّل الضريبة حسب التشريع العراقي النافذ (حالياً 5%).':['Tax and service fee (item 4) are deducted from net commission — adjust tax per current Iraqi law (now 5%).','باج و کرێ (بەند 4) لە کۆمیسیۆن دەبڕدرێن.','Vergi ve hizmet bedeli (madde 4) net komisyondan kesilir — Irak yasasına göre ayarla.','مالیات و هزینه (بند ۴) از کمیسیون کسر می‌شود.','Taxe et frais (point 4) déduits de la commission — selon la loi irakienne.','Impuesto y tarifa (punto 4) se deducen de la comisión.'],
'صافي الربح = العمولة − الضريبة − رسوم الخدمة، ويُقسَم بين الشركاء حسب البند 5.':['Net profit = commission − tax − service fee, split between partners per item 5.','قازانجی پاک = کۆمیسیۆن − باج − کرێ.','Net kâr = komisyon − vergi − bedel; madde 5’e göre bölünür.','سود خالص = کمیسیون − مالیات − هزینه؛ طبق بند ۵ تقسیم می‌شود.','Bénéfice net = commission − taxe − frais, partagé (point 5).','Beneficio neto = comisión − impuesto − tarifa (punto 5).'],
'الكاش: العمولة تصبح ذمّة على الكابتن · الإلكتروني: تدخل محفظة المنصّة فوراً.':["Cash: commission becomes the captain's debt · Electronic: goes straight to the platform wallet.",'کاش: دەبێتە قەرز · ئەلیکترۆنی: بۆ جزدان.','Nakit: kaptan borcu olur · Elektronik: doğrudan cüzdana.','نقدی: بدهی کاپیتان · الکترونیکی: مستقیم به کیف پول.','Espèces : dette du capitaine · Électronique : au portefeuille.','Efectivo: deuda del capitán · Electrónico: a la billetera.'],

/* أسماء المحافظات داخل أي جملة (للغات اللاتينية) + العملة */
let _provSub=null;
function provSubMap(){
  if(_provSub) return _provSub;
  const m=[];
  const add=(ar,en)=>{ if(ar&&ar.length>=3) m.push([ar,en]); };
  PROVINCES.forEach(pv=>{ if(pv.en){ add(pv.name, pv.en); const sh=pv.name.split(' ')[0].replace(/\(.*/,''); const she=pv.en.split(' (')[0]; if(sh&&sh!==pv.name) add(sh, she); } });
  m.push(['/كم','/km']); m.push(['/مقعد','/seat']); m.push([' كم',' km']); m.push(['كم/','km/']);
  add('خصوصي','Private'); add('دفع رباعي','SUV'); add('مسافر','Passenger'); add('كابتن','Captain'); add('سائق','Driver');
  add('(محلي)','(local)'); add('د.ع','IQD');
  m.sort((a,b)=>b[0].length-a[0].length);
  return _provSub=m;
}
/* استبدال آمن: حدود كلمات عربية (مع السماح بواو العطف قبل الاسم) */
function tokenSwap(txt){
  provSubMap().forEach(([a,e])=>{
    if(!txt.includes(a)) return;
    const esc=a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    txt=txt.replace(new RegExp('(^|[^\\u0600-\\u06FF])(و?)'+esc+'(?=$|[^\\u0600-\\u06FF])','g'),
      (mm,pre,waw)=>pre+(waw?'& ':'')+e);
  });
  return txt;
}


/* 📄 ترجمة الوثائق الطويلة (الدليل/الشروط/التعريفات/التحذيرات) آلياً
   عبر خادم Google مع تخزين دائم — فتُقرأ بأي لغة من اللغات السبع */
async function translateDocModal(){
  const vl=curLang(); if(vl==='ar') return;
  const host=document.getElementById('modal-host'); if(!host) return;
  if(!CONFIG.APPS_SCRIPT_URL){
    // بلا خادم: ملاحظة واحدة بلغة القارئ بدل ترك المستند صامتاً
    const note=document.createElement('div');
    note.className='pill gold'; note.style.cssText='width:100%;justify-content:center;margin:6px 0';
    note.textContent=T('docAr','هذه الوثيقة بالعربية — تُترجم آلياً بعد ضبط الخادم');
    const md=host.querySelector('.modal'); if(md&&!md.querySelector('.doc-note')){ note.classList.add('doc-note'); md.insertBefore(note, md.children[1]||null); }
    return;
  }
  S.trDocs=S.trDocs||{}; S.trDocs[vl]=S.trDocs[vl]||{};
  const cache=S.trDocs[vl];
  const tgt=(TR_CODE[vl]||vl);
  const w=document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
  const nodes=[]; let n;
  while(n=w.nextNode()){
    const t=n.nodeValue.trim();
    if(t && t.length>=6 && /[؀-ۿ]/.test(t)) nodes.push(n);
  }
  let changed=false;
  for(const nd of nodes.slice(0,80)){
    const t=nd.nodeValue.trim();
    const key=t.slice(0,160);
    if(cache[key]){ nd.nodeValue=nd.nodeValue.replace(t, cache[key]); continue; }
    const tr=await autoTranslate(t, tgt);
    if(tr && tr!==t){ cache[key]=tr; nd.nodeValue=nd.nodeValue.replace(t, tr); changed=true; }
    if(!document.getElementById('modal-host')) break; // أُغلقت النافذة
  }
  if(changed) saveState();
}

let _i18nObs=null,_i18nBusy=false,_i18nTimer=null;
function installI18nObserver(){
  if(_i18nObs) return;
  _i18nObs=new MutationObserver(()=>{
    if(_i18nBusy||curLang()==='ar') return;
    clearTimeout(_i18nTimer);
    _i18nTimer=setTimeout(()=>{ _i18nBusy=true; try{ translateDOM(); }catch(e){} _i18nBusy=false; },120);
  });
  [document.getElementById('app'),document.getElementById('modal-host')].forEach(h=>{
    if(h) _i18nObs.observe(h,{childList:true,subtree:true});
  });
}
function translateDOM(root){
  const lang=curLang(); if(lang==='ar') return;
  const idx={en:0,ku:1,tr:2,fa:3,fr:4,es:5}[lang]; if(idx===undefined) return;
  (root?[root]:[document.getElementById('app'),document.getElementById('modal-host')]).forEach(host=>{
    if(!host) return;
    const w=document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
    let n;
    while(n=w.nextNode()){
      const t=n.nodeValue.trim(); if(!t) continue;
      let hit=GLOT[t], out=hit&&hit[idx];
      if(!out){ // جرّب بدون بادئة الإيموجي/الرموز
        const m=t.match(/^([^\u0600-\u06FFA-Za-z]*)(.+)$/s);
        if(m&&m[2]){ const h2=GLOT[m[2].trim()]; if(h2&&h2[idx]) out=m[1]+h2[idx]; }
      }
      if(!out){ // 🧩 القوالب الديناميكية (نصوص فيها أرقام)
        for(const [rx,tpl] of GLOT_RX){
          const m=t.match(rx);
          if(m){ out=tpl[idx].replace(/\$(\d)/g,(_,i)=>m[+i]||''); break; }
        }
      }
      const latin=['en','tr','fr','es'].includes(lang);
      if(out){
        if(latin) out=tokenSwap(out);
        n.nodeValue=n.nodeValue.replace(t, out);
      } else if(latin && /[\u0600-\u06FF]/.test(t)){
        const t2=tokenSwap(t);
        if(t2!==t) n.nodeValue=n.nodeValue.replace(t, t2);
      }
    }
    host.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{
      const hit=GLOT[el.placeholder.trim()]; if(hit&&hit[idx]) el.placeholder=hit[idx];
    });
  });
}

function ico(emoji, size){
  size=size||32;
  const f=FLUENT[emoji];
  if(!f) return `<span style="font-size:${Math.round(size*.85)}px;line-height:1">${emoji}</span>`;
  return `<img src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/${encodeURI(f)}_3d.png" alt="" loading="lazy" draggable="false"
    style="width:${size}px;height:${size}px;object-fit:contain;filter:drop-shadow(0 5px 10px rgba(0,0,0,.4))"
    onerror="this.outerHTML='<span style=&quot;font-size:${Math.round(size*.85)}px;line-height:1&quot;>${emoji}</span>'">`;
}

function visibleServices(){ return SERVICES.filter(x=>MOD(x.id)); }
function PaxBookings(){
  const mode = S.serviceMode || 'home';
  if(mode==='home' || !SERVICES.some(s=>s.id===mode) && mode!=='minibus'){
    // الشاشة الرئيسية: اختر خدمتك
    return `${S.user.signed?'':`<button class="card" style="width:100%;display:flex;align-items:center;gap:12px;margin-bottom:12px;border-color:var(--gold);background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 14%,var(--surface)),var(--surface))" onclick="openSignIn()">
      <span style="font-size:30px">🔑</span>
      <span style="flex:1;text-align:start"><b style="font-size:calc(13.5px*var(--fs));display:block">سجّل دخولك الآن</b>
      <small class="t2" style="font-size:calc(10.5px*var(--fs))">احجز، تتبّع رحلاتك، واجمع نقاط الوفاء — بإيميلك أو حساب Google</small></span>
      <span class="pill gold">دخول ←</span>
    </button>`}${AdBanner()}<div class="section-title"><span class="bar"></span> ${S.user.signed?S.user.name.split(' ')[0]+' · ':''}${T('hello','أهلاً بك — ماذا تحتاج اليوم؟')}</div>
    <div class="svc-grid">
      ${visibleServices().map(s=>`<button class="svc-card" onclick="setServiceMode('${s.id}')">
        <span class="svc-ico">${ico(s.icon,66)}</span>
        <span class="svc-name">${T('svc.'+s.id+'.0',s.name)}</span>
        <span class="svc-desc">${T('svc.'+s.id+'.1',s.desc)}</span>
      </button>`).join('')}
    </div>
    <div class="card soft" style="margin-top:14px;text-align:center;font-size:calc(11.5px*var(--fs))">
      ${T('acNote','❄️ جميع مركباتنا <b>مكيّفة إلزامياً</b> (عدا الدراجات) · 🛡️ كباتن موثّقون بإجازة سوق معتمدة')}
    </div>`;
  }
  const svcInfo=SERVICES.find(s=>s.id===mode)||{icon:'🚐',name:'حافلة 11'};
  const backBar=`<div class="row" style="gap:8px;margin-bottom:12px;align-items:center">
    <button class="btn btn-ghost btn-sm" onclick="setServiceMode('home')">⬅ ${T('allSvc','كل الخدمات')}</button>
    <span class="pill gold">${svcInfo.icon} ${T('svc.'+(svcInfo.id||'line')+'.0',svcInfo.name)}</span>
  </div>`;
  if(mode==='tour') return backBar + PaxTour();
  if(mode==='gov') return backBar + PaxGov();
  if(mode==='port') return backBar + PaxPort();
  if(mode==='market') return backBar + PaxMarket();
  if(mode==='taxi') return backBar + PaxTaxi();
  if(mode==='moto') return backBar + PaxMoto();
  if(mode==='vip') return backBar + PaxVip();
  if(mode==='minibus') return backBar + PaxMinibus();
  if(mode==='school') return backBar + PaxSchool();
  return backBar + PaxLines(mode);
}

function openLandmarkNav(id){
  const l=lmById(id); if(!l) return;
  const tx=lmTxt(l);
  openModal(`<h3>🧭 ${tx.name}</h3>

  <a class="btn btn-green btn-block" style="margin-top:8px" target="_blank" rel="noopener"
     href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}">${T('tour.go','🗺️ ابدأ الملاحة في خرائط Google')}</a>
  <button class="btn btn-primary btn-block" style="margin-top:8px" onclick="openLandmarkRide('${l.id}')">${T('tour.ride','🚕 اطلب رحلة إليه')}</button>`);

    if(typeof L==='undefined') return;

/* أنواع مركبات خطوط المحافظات — كلها مكيّفة إلزامياً */
const VEH_TYPES={
  salon:{icon:'🚗', name:'صالون', seats:4, factor:1},
  suv7:{icon:'🚙', name:'دفع رباعي', seats:7, factor:1.45},
  bus11:{icon:'🚐', name:'باص ركاب', seats:11, factor:1.9}
};
function linePerSeat(km, veh){
  const v=VEH_TYPES[veh]||VEH_TYPES.salon;
  if(veh==='bus11') return Pricing.fareFor('minibus',{km});
  const total=Pricing.calc({km}).total * v.factor;
  return Math.round(total/v.seats/250)*250;
}

  if(n>=8){ pick='bus11'; why='عددكم كبير — الباص يجمعكم براحة وبأوفر سعر للمقعد'; }
  else if(n>=5 || (n>=4&&bags==='heavy')){ pick='suv7'; why='الدفع الرباعي يتّسع لمجموعتكم وأمتعتكم براحة تامة'; }
  else if(n<=3 && pri==='econ' && bags==='light'){ pick='salon'; why='الصالون الأوفر والأسرع لعددكم'; }
  else if(pri==='comfort'){ pick='suv7'; why='الدفع الرباعي أعلى راحة للمسافات الطويلة'; }

/* ---------- وضع التكسي بالعدّاد الحي (GPS taximeter) ---------- */

/* ======================================================================
   🚖 طلب السيارة الفوري (ride-hailing): الزبون يطلب من موقعه إلى وجهته،
   والنظام يعرض الطلب لأقرب الكباتن المسجّلين — من يقبل أولاً يأخذه.
   لا علاقة للمقاعد: السيارة كاملة لصاحب الطلب. والأجرة النهائية بالعدّاد.
   ====================================================================== */
const RIDE_TTL=20*60*1000;      // عمر الطلب غير المقبول
const RIDE_RADIUS_KM=12;        // نطاق عرض الطلب على الكباتن

/* موقع الكابتن: حقيقي من GPS إن شاركه، وإلا مركز محافظته (يُعلَّم تقريبياً) */
function driverLoc(d){
  if(d&&d.loc&&d.loc.lat) return {lat:d.loc.lat,lng:d.loc.lng,approx:false,age:Date.now()-(d.loc.t||0)};
  const pv=PROVINCES.find(x=>x.name===(d&&d.province))||prov('BAGHDAD');
  return {lat:pv.lat,lng:pv.lng,approx:true,age:0};
}
function rideList(){ S.rideReqs=S.rideReqs||[]; const now=Date.now();
  return S.rideReqs.filter(r=>['accepted','ongoing'].includes(r.status) || now-(r.t||0)<RIDE_TTL); }
function myRide(){ return rideList().find(r=>r.mine && ['searching','accepted','ongoing'].includes(r.status)); }
function driverRide(){ const me=myDriver(); if(!me) return null;
  return rideList().find(r=>r.driverId===me.id && ['accepted','ongoing'].includes(r.status)); }

/* الكباتن المتاحون لفئة السيارة الخصوصي، مرتّبون بالأقرب لنقطة الانطلاق */
function nearestCaptains(from, limit){
  if(!from) return [];
  return S.drivers
    .filter(d=>d.online!==false && ['car','vip','suv7'].includes(d.vehType||'car') && !driverBlocked(d.id))
    .map(d=>{ const L=driverLoc(d); return {d, km:Pricing.rawKm(from,L), approx:L.approx}; })
    .sort((a,b)=>a.km-b.km)
    .slice(0, limit||6);
}
/* تقدير الأجرة بالعدّاد قبل الطلب (سرعة مدينة ~25كم/س) */
function rideEstimate(from,to){
  if(!from||!to) return null;
  const km=Pricing.rawKm(from,to)*1.25;        // تعرّج الطرق
  const minutes=Math.max(3, km/25*60);
  const fare=Pricing.fareFor('taxi',{km,minutes});
  return {km, minutes, fare};
}
function taxiFromPoint(){ const pi=pickupInfo(); return pi?{lat:pi.lat,lng:pi.lng,label:pi.src}:null; }

/* 🚖 إنشاء الطلب */
function requestRide(){
  if(!requireSignIn(requestRide)) return;                 // 🔐 بوابة التسجيل للزائر
  const from=taxiFromPoint();
  if(!from){ toast(T('rq.needFrom','حدّد نقطة انطلاقك أولاً (GPS أو نقطة على الخريطة)'),'err'); openPickup(); return; }
  if(!S.taxiTo){ toast(T('rq.needTo','اختر وجهتك أولاً'),'err'); openTaxiDest(); return; }
  const est=rideEstimate(from,S.taxiTo);
  const near=nearestCaptains(from,6);
  const r={ id:uid('RD'), mine:true, t:Date.now(), status:'searching',
    paxName:S.user.name||'زبون', paxPhone:S.user.whatsapp||'', paxEmail:S.user.email||'',
    from, to:{lat:S.taxiTo.lat,lng:S.taxiTo.lng,label:S.taxiTo.name||S.taxiTo.label||''},
    km:+est.km.toFixed(2), minutes:Math.round(est.minutes), estFare:est.fare, boost:0,
    pay:S.ridePay||((activePayMethods()[0]||{}).id||'cash'),
    declined:[], notified:near.map(n=>n.d.id) };
  S.rideReqs=S.rideReqs||[]; S.rideReqs.unshift(r);
  saveState(); enqueueSync({type:'ride_request',id:r.id}); render();
  notifyFx('ok');
  toast(near.length?`🚖 ${T('rq.sent','أُرسل طلبك إلى')} ${near.length} ${T('rq.captains','كابتن قريب')}`:T('rq.noneNear','لا كباتن متصلون قريباً الآن — سيظهر طلبك لأي كابتن يتصل'),'ok');
}
function cancelRide(id){
  const r=(S.rideReqs||[]).find(x=>x.id===id); if(!r) return;
  r.status='cancelled'; saveState(); enqueueSync(); render();
  toast(T('rq.cancelled','أُلغي طلبك'),'info');
}
/* ⬆️ رفع الأجرة حين لا يوافق أحد */
function openRideBoost(id){
  if(!MOD('boost')){ toast(T('mod.off','زيادة الأجرة غير مفعّلة حالياً'),'err'); return; }
  const r=(S.rideReqs||[]).find(x=>x.id===id); if(!r) return;
  const step=Math.max(500, Math.round(r.estFare*0.1/500)*500);

  <p class="t2" style="font-size:calc(11.5px*var(--fs))">${T('rq.raiseNote','الزيادة تُضاف فوق أجرة العدّاد وتصل الكابتن كاملةً ضمن الأجرة — تظهر لطلبك كأولوية.')}</p>

  </div>

    ${[step,step*2,step*4].map(v=>`<button class="btn btn-ghost btn-sm" style="flex:1" onclick="addRideBoost('${r.id}',${v})">+${fmt(v)}</button>`).join('')}

}
function addRideBoost(id, v){
  const r=(S.rideReqs||[]).find(x=>x.id===id); if(!r) return;
  r.boost=(r.boost||0)+v; r.t=Date.now(); r.declined=[]; // تجديد الطلب لكل الكباتن
  saveState(); enqueueSync(); closeModal(); render(); notifyFx('ok');
  toast(`⬆️ ${T('rq.raised','رُفعت الأجرة')} +${fmt(r.boost)} د.ع — ${T('rq.resent','أُعيد عرض طلبك على الكباتن')}`,'ok');
}

function openRidePay(id){

  openPayGuide(r.pay||'cash', r.finalFare||(r.estFare+(r.boost||0)),
    {driverPhone:(d&&(d.payPhone||d.phone))||'', route:`${r.from.label||''} ← ${r.to.label||''}`});
}
/* محادثة طلب التكسي (نفس محرك المحادثة مع ترجمة ثنائية الاتجاه) */
function openRideChat(rideId){
  const r=(S.rideReqs||[]).find(x=>x.id===rideId); if(!r) return;
  let t=S.trips.find(x=>x.id==='RIDE_'+rideId);
  if(!t){ t={id:'RIDE_'+rideId, service:'taxi', from:S.from, to:S.to, farePerSeat:r.estFare,
      bookedSeats:1, totalSeats:1, passengers:[{id:'p',name:r.paxName,mine:!!r.mine,phone:r.paxPhone}],
      status:'في الطريق', driverId:r.driverId, driverName:r.driverName, chat:[] };
    S.trips.push(t); saveState(); }
  t.driverId=r.driverId; t.driverName=r.driverName;
  openTripChat(t.id);
}
/* صورة الكابتن المصغّرة — يراها المسافر مع معلومات السيارة */

/* 💵 نظام الذمّة: السقف، الحجب، والرصيد الدائن */
function debtCap(){ return (S.fin&&S.fin.debtCap!=null)?S.fin.debtCap:10000; }
function driverDebt(id){ return S.driverDebts[id]||0; } // قد تكون سالبة = رصيد دائن له
function driverBlocked(id){ return driverDebt(id) > debtCap(); }
function DebtBanner(me){
  const debt=driverDebt(me.id), cap=debtCap();
  if(debt>cap) return `<div class="card" style="margin-bottom:12px;border-color:var(--red);background:linear-gradient(135deg,color-mix(in srgb,var(--red) 14%,var(--surface)),var(--surface))">
    <b style="color:var(--red)">⛔ الخدمة محجوبة — ذمّتك ${fmt(debt)} د.ع تجاوزت السقف (${fmt(cap)} د.ع)</b>
    <div class="t2" style="font-size:calc(11px*var(--fs));margin-top:4px">لن تستلم رحلات جديدة حتى تنزل الذمّة تحت السقف. سدّد الآن بتحويل إلى ماستر كارد أو بقسيمة أو من محفظتك.</div>
    <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="payDriverDebt('${me.id}')">💳 سدّد الآن وأعد تفعيل الخدمة</button>
  </div>`;
  if(debt>cap*0.7) return `<div class="pill gold" style="width:100%;justify-content:center;margin-bottom:12px">⚠️ ذمّتك ${fmt(debt)} د.ع — اقتربت من سقف الحجب (${fmt(cap)} د.ع)</div>`;
  if(debt<0) return `<div class="pill green" style="width:100%;justify-content:center;margin-bottom:12px">💚 لديك رصيد دائن ${fmt(-debt)} د.ع — يُخصم من ذممك القادمة تلقائياً</div>`;
  return '';
}

// ينتظر تحميل Leaflet (قد يصل متأخراً) ثم ينفّذ، أو يظهر رسالة بعد مهلة
function whenMapReady(el, done, tries){
  tries = tries||0;
  if(MapEngine.available()){ done(); return; }
  if(window._leafletFailed || tries>40){ // ~10 ثوانٍ
    el.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:16px;color:var(--text-2)">
      <div style="font-size:30px">🗺️</div>
      <div style="font-weight:700;margin-top:8px;font-size:calc(12px*var(--fs))">تعذّر تحميل الخريطة</div>
      <div style="font-size:calc(11px*var(--fs));margin-top:4px">تحقّق من اتصال الإنترنت ثم أعد المحاولة</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="render()">🔄 إعادة المحاولة</button></div>`;
    try{ translateDOM(el); }catch(e){}
    return;
  }
  setTimeout(()=>whenMapReady(el, done, tries+1), 250);
}
function initLiveMap(){
  const el=document.getElementById('live-map'); if(!el) return;
  el.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-2);font-size:calc(12px*var(--fs))">🗺️ جارٍ تحميل الخريطة…</div>`;
  whenMapReady(el, ()=>_renderLiveMap());
}
function _renderLiveMap(){
  const t=activeTrip(); if(!t) return;
  const from=prov(t.from), to=prov(t.to);
  const sameSpot = (t.from===t.to); // خدمات محلية (مدرسة/تكسي داخل المدينة)
  const center={lat:(from.lat+to.lat)/2, lng:(from.lng+to.lng)/2};
  setTimeout(()=>{
    if(!document.getElementById('live-map')) return;
    const m=MapEngine.init('live-map', center, sameSpot?13:7);
    if(!m) return;
    if(sameSpot){
      MapEngine.addMarker('from', from.lat, from.lng, (t.service==='school'?'🏫':'📍'), t.label? t.label.split('→')[1]||'الوجهة' : from.name.split(' ')[0]);
    } else {
      MapEngine.addMarker('from', from.lat, from.lng, '🏁', from.name.split(' ')[0]);
      MapEngine.addMarker('to', to.lat, to.lng, '📍', to.name.split(' ')[0]);
      MapEngine.drawRoute(from, to);
      if(t.progress>0){
        const dLat=from.lat+(to.lat-from.lat)*t.progress;
        const dLng=from.lng+(to.lng-from.lng)*t.progress;
        MapEngine.addMarker('driver', dLat, dLng, '🚖', 'السائق');
      }
    }
    if(GPS.currentPos){
      MapEngine.addMarker('me', GPS.currentPos.lat, GPS.currentPos.lng, '📱', 'أنت');
    }
    // 🛂 مناطق التصاريح + 🚨 البلاغات المجتمعية على خريطة الرحلة
    try{ drawZones(MapEngine.map); Reports.drawOn(MapEngine.map); }catch(e){}
    // 📍 نقطة الالتقاء المؤكدة على الخريطة
    if(t.meetPoint){
      MapEngine.addMarker('meet', t.meetPoint.lat, t.meetPoint.lng, '🚩', 'نقطة الالتقاء');
    }
    // التتبّع المباشر الثنائي: السائق يرى الزبون والزبون يرى السائق
    startLiveTracking(t);
  }, 120);
}
// يبدأ مشاركة الموقع ويحدّث علامة الطرف الآخر على الخريطة
function startLiveTracking(t){
  if(!t.goT){ t.goT=Date.now(); saveState(); } // ⏱️ بداية فعلية — للتعلم من زمن الرحلة
  const role=S.role==='DRIVER'?'DRIVER':'PASSENGER';
  // 🛡️ حارس الزبون: يسجّل أقصى تقدّم للزبون نحو الوجهة بـ GPS هاتفه هو —
  // لإحباط التحايل بإلغاء الرحلة بعد قطع المسافة أو إطفاء موقع السائق
  if(role==='PASSENGER' && navigator.geolocation && !t._paxWatch){
    const from=prov(t.from), to=prov(t.to);
    t._paxWatch=navigator.geolocation.watchPosition(p=>{
      const me={lat:p.coords.latitude,lng:p.coords.longitude};
      if(from&&to){
        const done=Pricing.rawKm(from,me), remain=Pricing.rawKm(me,to);
        const prog=Math.min(1,Math.max(0,done/((done+remain)||1)));
        if(prog>(t.paxProg||0)){ t.paxProg=prog; }
      }
      t.paxLastFix=Date.now(); t.paxGpsOff=false;
    },()=>{ t.paxGpsOff=true; },{enableHighAccuracy:true,maximumAge:5000});
  }
  LiveTrack.start(t.id, role, (peer)=>{
    if(!peer || !MapEngine.map) return;
    const isDriver = role!=='DRIVER'; // الطرف الآخر
    let icon = isDriver?'🚖':'📱';
    if(isDriver){ const d=tripDriver(t); if(d&&d.carStyle&&d.carStyle.icon) icon=d.carStyle.icon; }
    const label = isDriver?'السائق':'الراكب';
    MapEngine.addMarker('peer', peer.lat, peer.lng, icon, label);
    // ضمّ العلامات في الإطار
    MapEngine.fitAll();
    // حدّث لافتة "آخر تحديث"
    const ov=document.querySelector('.map-overlay');
    if(ov){ const sec=Math.round((Date.now()-(peer.t||Date.now()))/1000);
      ov.innerHTML=`🟢 ${label} على الخريطة · قبل ${sec}ث`; }
  });
  // أبقِ موقعي ظاهراً
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{
      MapEngine.addMarker('me', p.coords.latitude, p.coords.longitude, '📍','أنت');
    },()=>{},{enableHighAccuracy:true,timeout:8000});
  }
}


/* ======================================================================
   🧭 البُراق نافيغيتور — ملاحة كاملة بمستوى Waze/دربونة:
   مسار حي على خرائط العراق المحدّثة (OpenStreetMap)، بلاغات مجتمعية
   (حوادث/قطع طرق/سيطرات)، تعلّم من رحلات المستخدمين، ومناطق التصاريح.
   ====================================================================== */
const NAV={
  map:null, routeLayer:null, marks:[],
  /* مسار حقيقي عبر طرق العراق (خادم OSRM على خرائط OSM المحدّثة) */
  async route(a, b){
    try{
      const u=`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&steps=true&alternatives=true`;
      const r=await fetch(u); const j=await r.json();
      if(j.code==='Ok'&&j.routes&&j.routes.length){
        // اختر أفضل بديل: الأسرع، مع تعديل حسب بلاغات الطريق الفعّالة القريبة من المسار
        const scored=j.routes.map(rt=>{
          let penalty=0;
          const pts=rt.geometry.coordinates;
          Reports.active().forEach(rp=>{
            const near=pts.some((c,i)=> i%12===0 && Math.hypot(c[1]-rp.lat,(c[0]-rp.lng)*0.83)<0.012);
            if(near) penalty += (rp.type==='block'?900:rp.type==='accident'?420:rp.type==='jam'?240:90);
          });
          return {rt, cost:rt.duration+penalty};
        }).sort((x,y)=>x.cost-y.cost);
        const best=scored[0].rt;
        return {ok:true, km:best.distance/1000, min:best.duration/60,
                coords:best.geometry.coordinates.map(c=>[c[1],c[0]]),
                steps:(best.legs[0]?.steps||[]).map(st=>({
                  txt:NAV.stepText(st), km:st.distance/1000,
                  lat:st.maneuver&&st.maneuver.location?st.maneuver.location[1]:null,
                  lng:st.maneuver&&st.maneuver.location?st.maneuver.location[0]:null})).filter(x=>x.txt),
                avoided:scored.length>1&&scored[0].rt!==j.routes[0]};
      }
    }catch(e){}
    // بديل دون إنترنت: خط مباشر وتقدير بسرعة 80كم/س
    const km=Pricing.distanceKm(a,b);
    return {ok:false, km, min:km/80*60, coords:[[a.lat,a.lng],[b.lat,b.lng]], steps:[], avoided:false};
  },
  stepText(st){
    const t=st.maneuver?.type, m=st.maneuver?.modifier||'', n=st.name||'';
    const M={'left':'يساراً','right':'يميناً','slight left':'يسار خفيف','slight right':'يمين خفيف','straight':'مباشرة','uturn':'استدارة كاملة'};
    const dir=M[m]||'';
    if(t==='depart') return '🚦 انطلق'+(n?' عبر '+n:'');
    if(t==='arrive') return '🏁 وصلت إلى وجهتك';
    if(t==='turn'||t==='end of road'||t==='continue') return `↪️ انعطف ${dir}`+(n?' نحو '+n:'');
    if(t==='roundabout'||t==='rotary') return `🔄 من الدوّار اخرج ${st.maneuver.exit?('مخرج '+st.maneuver.exit):''}`+(n?' نحو '+n:'');
    if(t==='merge') return `🛣️ اندمج ${dir}`+(n?' مع '+n:'');
    if(t==='fork') return `🔱 عند التفرع خذ ${dir}`;
    if(t==='on ramp') return '⤴️ اصعد المنحدر'+(n?' نحو '+n:'');
    if(t==='off ramp') return '⤵️ انزل من المخرج'+(n?' نحو '+n:'');
    return n?('⬆️ تابع عبر '+n):'';
  }
};

/* 🚨 البلاغات المجتمعية — مثل Waze: الكل يبلّغ والكل يستفيد */
const REPORT_TYPES={
  accident:{ico:'🚨', name:'حادث مروري', pen:'تجنُّب قوي'},
  block:{ico:'⛔', name:'قطع طريق', pen:'تجنُّب تام'},
  jam:{ico:'🐢', name:'زحام خانق', pen:'تجنُّب متوسط'},
  police:{ico:'🚓', name:'سيطرة / نقطة تفتيش', pen:'تنبيه'},
  hazard:{ico:'⚠️', name:'خطر على الطريق', pen:'تنبيه'},
  pothole:{ico:'🕳️', name:'حفرة / تخسفات', pen:'تنبيه'}
};
const Reports={
  TTL: 3*3600*1000, // صلاحية البلاغ 3 ساعات ما لم يؤكَّد مجدداً
  active(){ const now=Date.now(); return (S.roadReports||[]).filter(r=>now-(r.t||0)<this.TTL); },
  add(type, lat, lng, note){
    S.roadReports=this.active();
    const r={id:uid('R'), type, lat, lng, note:note||'', t:Date.now(), by:S.user.name||'مستخدم', conf:1};
    S.roadReports.push(r);
    S.user.points=(S.user.points||0)+5; // 🏆 نقاط سكور المجتمع
    saveState(); this.sync(); return r;
  },
  confirm(id){
    const r=(S.roadReports||[]).find(x=>x.id===id); if(!r) return;
    r.conf=(r.conf||1)+1; r.t=Date.now(); // التأكيد يجدّد الصلاحية
    S.user.points=(S.user.points||0)+2;
    saveState(); this.sync();
  },
  clear(id){ S.roadReports=(S.roadReports||[]).filter(x=>x.id!==id); saveState(); this.sync(); },
  async sync(){ // مشاركة البلاغات بين كل المستخدمين عبر الخادم
    if(!CONFIG.APPS_SCRIPT_URL) return;
    try{ await fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'live_push', tripId:'BRAQ_ROAD_REPORTS', role:'all', loc:{list:this.active()}})}); }catch(e){}
  },
  async pull(){
    if(!CONFIG.APPS_SCRIPT_URL) return;
    try{
      const r=await fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'live_pull', tripId:'BRAQ_ROAD_REPORTS', role:'all'})});
      const j=await r.json();
      if(j&&j.loc&&Array.isArray(j.loc.list)){
        const mine=this.active(), ids=new Set(mine.map(x=>x.id));
        j.loc.list.forEach(x=>{ if(!ids.has(x.id)) mine.push(x); });
        S.roadReports=mine; saveState();
      }
    }catch(e){}
  },
  drawOn(map){
    this.active().forEach(r=>{
      const rt=REPORT_TYPES[r.type]||{ico:'⚠️',name:'بلاغ'};
      try{
        L.marker([r.lat,r.lng],{icon:L.divIcon({className:'',html:`<div style="font-size:22px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))">${rt.ico}</div>`,iconSize:[26,26]})})
         .addTo(map).bindPopup(`<b>${rt.ico} ${rt.name}</b><br>${r.note||''}<br><small>قبل ${Math.round((Date.now()-r.t)/60000)} دقيقة · ✅ ${r.conf||1} تأكيد</small>`);
      }catch(e){}
    });
  }
};

/* 📈 التعلّم من رحلات المستخدمين — متوسط الزمن الفعلي لكل مسار */
const RouteLearn={
  key(f,t){ return [f,t].sort().join('–'); },
  record(f,t,minutes){
    if(!f||!t||!minutes||minutes<=0) return;
    S.routeStats=S.routeStats||{};
    const k=this.key(f,t), st=S.routeStats[k]||{n:0,avg:0};
    st.avg=Math.round((st.avg*st.n+minutes)/(st.n+1)); st.n++;
    S.routeStats[k]=st; saveState();
  },
  avgMin(f,t){ const st=(S.routeStats||{})[this.key(f,t)]; return st&&st.n>=1?st.avg:null; }
};

function pickupInfo(){
  const pk=S.pickup||{mode:'gps'};
  if(pk.mode==='map'&&pk.lat) return {lat:pk.lat,lng:pk.lng,label:pk.label||'📌 نقطة محددة على الخريطة',src:'📌 نقطة حدّدتها'};

let _gpsBoxTimer=null;
function refreshGpsBox(){

function setPickup(mode){

function pickOnMap(){
  const pv=prov(S.from)||PROVINCES[0];

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(m);

        trips:[], drivers:[], ledger:[], payouts:[], coupons:[], transactions:[], disputes:[], schoolSubs:[], driverDebts:S.driverDebts||{}, outbox:[]};
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});

/* 🩺 فحص قابلية التثبيت — يشخّص بدقة لماذا لا يعرض أندرويد «تثبيت» */

/* ===== 📲 شريط التثبيت التلقائي — يظهر مرة واحدة فور جهوزية كروم ===== */
function appInstalled(){
  try{
    if(matchMedia('(display-mode: standalone)').matches) return true;
    if(navigator.standalone) return true;                       // iOS
    return localStorage.getItem('braq_installed')==='1';
  }catch(e){ return false; }
}
function hideInstallBar(){ const el=document.getElementById('install-bar'); if(el) el.remove(); }
function showInstallBar(){
  if(appInstalled() || document.getElementById('install-bar')) return;
  try{ if(sessionStorage.getItem('braq_install_dismiss')==='1') return; }catch(e){}
  const bar=document.createElement('div');
  bar.id='install-bar';
  bar.innerHTML=`<div class="ib-ic">📲</div>
    <div class="ib-tx"><b>ثبّت البُراق على هاتفك</b><span>يفتح كتطبيق مستقل بأيقونته الخاصة — ويعمل بلا إنترنت</span></div>
    <button class="ib-go" onclick="doInstallNow()">تثبيت</button>
    <button class="ib-x" onclick="dismissInstallBar()" aria-label="إغلاق">✕</button>`;
  document.body.appendChild(bar);
  try{ translateDOM(bar); }catch(e){}
}
function dismissInstallBar(){ try{ sessionStorage.setItem('braq_install_dismiss','1'); }catch(e){} hideInstallBar(); }
async function doInstallNow(){
  if(!window._installEvt){ hideInstallBar(); installDoctor(); return; }
  try{
    window._installEvt.prompt();
    const r=await window._installEvt.userChoice;
    if(r && r.outcome==='accepted'){ window._installEvt=null; hideInstallBar();
      try{ localStorage.setItem('braq_installed','1'); }catch(e){}
      toast('📲 جارٍ التثبيت — ستجد أيقونة البُراق على شاشتك ✅','ok');
    } else { dismissInstallBar(); }
  }catch(e){ hideInstallBar(); installDoctor(); }
}

async function installDoctor(){
  const rows=[];
  const add=(ok,label,fix)=>rows.push({ok,label,fix});
  const secure = window.isSecureContext || location.protocol==='https:';

  let swOk=false; try{ swOk=!!(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration()); }catch(e){}
  add(swOk,'Service Worker مسجَّل','يتسجّل تلقائياً عند الفتح عبر HTTPS — إن بقي ✗ فالملف sw.js غير مرفوع بجانب index.html.');
  let mOk=false, iOk=false;
  try{ const r=await fetch('manifest.json'); mOk=r.ok; }catch(e){}
  add(mOk,'ملف manifest.json موجود','ارفع manifest.json بجانب index.html.');
  try{ const r=await fetch('assets/icon-192.png'); iOk=r.ok; }catch(e){}
  add(iOk,'أيقونات التطبيق (assets/)','ارفع مجلد assets كاملاً بجانب index.html — بدونه يعرض كروم «اختصار» فقط.');
  const inst=appInstalled();
  add(!!window._installEvt || inst, inst?'التطبيق مثبَّت بالفعل ✓':'كروم جهّز زر التثبيت',
    'يجهز تلقائياً بعد تحقق كل ما فوق وبعد ثوانٍ من التصفّح. إن تحقّق كل ما فوق ولم يظهر: أعد تحميل الصفحة، أو من قائمة كروم ⋮ ← «تثبيت التطبيق» مباشرة.');
  const allOk=rows.every(r=>r.ok);
  openModal(`<h3>🩺 فحص قابلية التثبيت</h3>
  ${rows.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
    <b style="color:var(--${r.ok?'green':'red'})">${r.ok?'✅':'❌'} ${r.label}</b>
    ${r.ok?'':`<div class="t2" style="font-size:calc(10.5px*var(--fs));margin-top:3px;line-height:1.8">${r.fix}</div>`}
  </div>`).join('')}
  ${allOk?`<button class="btn btn-primary btn-block" style="margin-top:10px" onclick="window._installEvt&&window._installEvt.prompt()">📲 ثبّت الآن</button>`
         :`<div class="pill gold" style="width:100%;justify-content:center;margin-top:10px">أصلح البنود الحمراء ثم أعد الفحص</div>`}
  <div class="muted" style="font-size:calc(9px*var(--fs));margin-top:10px;direction:ltr;text-align:start;word-break:break-all">${location.protocol}//${location.host||'(file)'}${location.pathname}</div>
  <button class="btn btn-ghost btn-block btn-sm" style="margin-top:8px" onclick="installDoctor()">🔄 إعادة الفحص</button>`);
}
/* 💾 نسخة احتياطية كاملة — حماية بيانات الزبائن والكباتن والمدراء عبر التحديثات */
function exportBackup(){
  try{
    const data=JSON.stringify(S);
    const blob=new Blob([data],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`alburaq-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('💾 نُزِّلت النسخة الاحتياطية — احفظها بمكان آمن','ok');
  }catch(e){ toast('تعذّر إنشاء النسخة','err'); }
}
function importBackup(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const obj=JSON.parse(rd.result);
      if(!obj||!obj.user||!obj.fin){ toast('الملف ليس نسخة بُراق صالحة','err'); return; }
      openModal(`<h3>⚠️ استرجاع نسخة احتياطية</h3>
      <p class="t2" style="font-size:calc(12px*var(--fs))">سيستبدل هذا كل بيانات التطبيق الحالية ببيانات النسخة. متأكد؟</p>
      <button class="btn btn-primary btn-block" style="margin-top:10px" onclick='doImportBackup()'>✅ نعم، استرجع النسخة</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">تراجع</button>`);
      window._pendingBackup=obj;
    }catch(e){ toast('ملف تالف أو غير صالح','err'); } };
    rd.readAsText(f); };
  inp.click();
}
function doImportBackup(){
  if(!window._pendingBackup) return;
  S=migrateState(window._pendingBackup); window._pendingBackup=null;
  saveState(); closeModal(); render();
  toast('✅ استُرجعت النسخة الاحتياطية بكامل بياناتها','ok');
}

function gpsDoctor(){
  openModal(`<h3>🩺 فحص GPS الجهاز</h3>
  <div id="gd-box" class="card soft">${gpsStatusHTML()}</div>
  <div class="t2" style="font-size:calc(11px*var(--fs));margin-top:10px;line-height:1.9">
  <b>إن لم يعمل:</b><br>
  1️⃣ فعّل «الموقع/Location» من إعدادات الهاتف.<br>
  2️⃣ اسمح للتطبيق بصلاحية الموقع.<br>
  3️⃣ اخرج لمكان مكشوف — الأبنية تضعف الإشارة.<br>
  4️⃣ الدقة تتحسن بعد ثوانٍ من التشغيل.</div>
  <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="gdRetry()">🔄 إعادة المحاولة الآن</button>`);
  const tick=()=>{ const el=document.getElementById('gd-box'); if(el){ el.innerHTML=gpsStatusHTML(); setTimeout(tick,1500); } };

function gdRetry(){

function navState(){

function unitM(){ return ['en','tr','fr','es'].includes(curLang())?'m':'م'; }
function navPointLabel(pt){

function navResolve(pt){

    if(GPS.currentPos) return {lat:GPS.currentPos.lat,lng:GPS.currentPos.lng,name:T('nv.myLoc','موقعي الحالي')};
    return null;
  }
  return {lat:pt.lat,lng:pt.lng,name:pt.name};
}

async function psSearch(q){
  const box=document.getElementById('ps-res'); if(!box) return;

  }).slice(0,4).map(o=>({name:lmTxt(o).name, sub:T('ps.braq','من أدلة البُراق'), lat:o.lat, lng:o.lng, local:true}));
  let web=[];
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&countrycodes=iq&format=json&limit=7&accept-language=${curLang()==='ar'?'ar':'en'}`,{headers:{'Accept':'application/json'}});
    const j=await r.json();

function navDrive(){

function navRide(){
  const nv=navState(), to=navResolve(nv.to);

  if(from&&nv.from.mode!=='gps') S.pickup={mode:'map',lat:from.lat,lng:from.lng,label:'📌 '+from.name};
  else S.pickup={mode:'gps'};

  toast(`${T('ps.dest','وجهتك')}: ${to.name} — ${provName(best)} 🚕`,'ok');
}

/* 🧭 ملاحة حرة — اختر وجهتك من كل أدلة البُراق */
let _navMap=null;
async function openNavTo(lat,lng,name,origin){

  openModal(`<h3>🧭 ${name||'الملاحة'}</h3>
  <div id="nav-eta" class="row" style="gap:8px;margin:8px 0"><span class="pill cyan">⏳ يحسب أفضل مسار…</span></div>
  <div class="map-wrap" style="height:260px"><div id="nav-map" style="height:100%"></div></div>

  window._navOrigin=origin||null;

    const el=document.getElementById('nav-map'); if(!el||typeof L==='undefined') return;

    try{

        eta.innerHTML=`<span class="pill gold">📏 ${r.km.toFixed(1)} كم</span>
          <span class="pill cyan">⏱️ ≈ ${Math.round(r.min)} دقيقة</span>
          ${r.ok?'':'<span class="pill red">بلا إنترنت — تقدير مباشر</span>'}
          ${r.avoided?'<span class="pill green">🔀 بدّلنا المسار لتجنّب بلاغ</span>':''}`;
      }
      const zs=zonesNear(lat,lng);
      const zEl=document.getElementById('nav-zones');
      if(zEl&&zs.length){
        zEl.innerHTML=zs.map(z=>`<div class="card soft" style="margin-top:8px;border-color:var(--red)">

          <div class="t2" style="font-size:calc(10.5px*var(--fs));margin-top:3px">${z.note}</div>
          <div class="muted" style="font-size:calc(9.5px*var(--fs));margin-top:2px">المطلوب: ${zoneBadgeName(z.badge)} — اختر كابتناً مخوّلاً عند الحجز</div>
        </div>`).join('');
      }
      const st=document.getElementById('nav-steps');
      if(st&&r.steps.length){
        st.innerHTML=`<div class="section-title" style="margin:6px 0"><span class="bar"></span> خط السير</div>`+
          r.steps.map(x=>`<div class="between" style="padding:5px 0;border-bottom:1px solid var(--border)">
            <span class="t2" style="font-size:calc(11px*var(--fs))">${x.txt}</span>
            <small class="muted">${x.km>=1?x.km.toFixed(1)+' كم':Math.round(x.km*1000)+' م'}</small></div>`).join('');

function driveFromNav(lat,lng,name){
  const from=window._navOrigin||GPS.currentPos;
  if(!from){ toast('بانتظار إشارة GPS لبدء القيادة…','err'); gpsDoctor(); return; }
  enterDriveMode(from,{lat,lng,name:name||'الوجهة'});
}
/* ======================================================================
   ▶️ وضع القيادة الحي — شاشة كاملة مثل Waze/دربونة:
   الخريطة تتبع موقعك، تعليمة المنعطف القادم بشكل بارز، السرعة،
   الزمن والمسافة المتبقية، إعادة توجيه تلقائية عند الانحراف، وزر بلاغ.
   ====================================================================== */
const Drive={ map:null, on:false, route:null, dest:null, watch:null, myMk:null, line:null, lastReroute:0 };
async function enterDriveMode(from, to){
  closeModal();
  if(Drive.on) exitDriveMode();
  Drive.on=true; Drive.dest=to;
  const ov=document.createElement('div');
  ov.id='drive-ov';
  ov.style.cssText='position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column';
  ov.innerHTML=`
    <div id="dr-top" style="padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
      <span id="dr-arrow" style="font-size:30px">⬆️</span>
      <div style="flex:1;min-width:0">
        <b id="dr-step" style="font-size:calc(14px*var(--fs));display:block">جارٍ حساب المسار…</b>
        <small id="dr-next" class="muted"></small>
      </div>
      <button class="icon-btn" onclick="exitDriveMode()" style="font-size:18px">✖️</button>
    </div>
    <div id="dr-map" style="flex:1"></div>
    <div style="padding:10px 14px;background:var(--surface-2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px">
      <div style="text-align:center"><b id="dr-speed" style="font-size:calc(20px*var(--fs));color:var(--gold)">0</b><small class="muted" style="display:block">كم/س</small></div>
      <div style="flex:1;text-align:center"><b id="dr-eta" style="font-size:calc(14px*var(--fs))">--</b><small class="muted" style="display:block" id="dr-dist">--</small></div>
      <button class="btn btn-ghost btn-sm" onclick="openRoadReport()">🚨</button>
      <button class="btn btn-cyan btn-sm" onclick="Drive.map&&GPS.currentPos&&Drive.map.setView([GPS.currentPos.lat,GPS.currentPos.lng],16)">🎯</button>
    </div>`;
  document.body.appendChild(ov);
  try{
    Drive.map=L.map('dr-map',{zoomControl:false}).setView([from.lat,from.lng],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(Drive.map);
    drawZones(Drive.map); Reports.drawOn(Drive.map);
    L.marker([to.lat,to.lng]).addTo(Drive.map).bindPopup(to.name||'الوجهة');
    Drive.myMk=L.marker([from.lat,from.lng],{icon:L.divIcon({className:'',html:'<div style="font-size:26px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))">🧭</div>',iconSize:[30,30]})}).addTo(Drive.map);
  }catch(e){}
  await driveRoute(from);
  // تتبّع حي
  if(navigator.geolocation){
    Drive.watch=navigator.geolocation.watchPosition(p=>{
      if(!Drive.on) return;
      const me={lat:p.coords.latitude,lng:p.coords.longitude};
      GPS.currentPos=me; GPS.accuracy=Math.round(p.coords.accuracy);
      const sp=p.coords.speed?Math.round(p.coords.speed*3.6):0;
      const se=document.getElementById('dr-speed'); if(se) se.textContent=sp;
      if(Drive.myMk) Drive.myMk.setLatLng([me.lat,me.lng]);
      if(Drive.map) Drive.map.setView([me.lat,me.lng], Math.max(Drive.map.getZoom(),15), {animate:true});
      driveProgress(me);
    },()=>{},{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
  }
}
async function driveRoute(from){
  const r=await NAV.route(from, Drive.dest);
  Drive.route=r;
  try{
    if(Drive.line) Drive.line.remove();
    Drive.line=L.polyline(r.coords,{color:'#FBBF24',weight:6,opacity:.95}).addTo(Drive.map);
  }catch(e){}
  driveHUD(r.km, r.min, r.steps[0]);
}
function driveHUD(km,min,step){
  const st=document.getElementById('dr-step'), nx=document.getElementById('dr-next'),
        eta=document.getElementById('dr-eta'), di=document.getElementById('dr-dist'), ar=document.getElementById('dr-arrow');
  if(st) st.textContent=step?step.txt.replace(/^[^ ]+ /,''):'تابع المسار';
  if(ar&&step){ const m=step.txt.match(/^([^\s]+)/); ar.textContent=m?m[1]:'⬆️'; }
  if(nx) nx.textContent=step&&step.km?('بعد '+(step.km>=1?step.km.toFixed(1)+' كم':Math.round(step.km*1000)+' م')):'';
  if(eta){ const t=new Date(Date.now()+min*60000); eta.textContent='الوصول ≈ '+t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0')+' ('+Math.round(min)+' د)'; }
  if(di) di.textContent=km.toFixed(1)+' كم متبقية';
}
function driveProgress(me){
  const r=Drive.route; if(!r||!r.coords||!r.coords.length) return;
  // أقرب نقطة على المسار
  let bi=0, bd=1e9;
  r.coords.forEach((c,i)=>{ const d=Pricing.rawKm(me,{lat:c[0],lng:c[1]}); if(d<bd){bd=d;bi=i;} });
  // انحراف عن المسار → إعادة توجيه (مرة كل 30 ثانية كحد أقصى)
  if(bd>0.18 && Date.now()-Drive.lastReroute>30000){
    Drive.lastReroute=Date.now();
    toast('🔄 انحرفت عن المسار — إعادة التوجيه…','info');
    driveRoute(me); return;
  }
  // المتبقي
  let remKm=0;
  for(let i=bi;i<r.coords.length-1;i++) remKm+=Pricing.rawKm({lat:r.coords[i][0],lng:r.coords[i][1]},{lat:r.coords[i+1][0],lng:r.coords[i+1][1]});
  const remMin=r.min*(remKm/Math.max(r.km,0.01));
  // التعليمة القادمة = أول خطوة موقعها أمامنا
  let next=null;
  if(r.steps&&r.steps.length){
    for(const st of r.steps){
      if(st.lat==null) continue;
      const idx=r.coords.findIndex(c=>Math.abs(c[0]-st.lat)<0.0004&&Math.abs(c[1]-st.lng)<0.0004);
      if(idx>=bi){ next={...st, km:Pricing.rawKm(me,{lat:st.lat,lng:st.lng})}; break; }
    }
  }
  driveHUD(remKm, remMin, next);
  if(remKm<0.08){ toast('🏁 وصلت إلى وجهتك — رحلة سعيدة!','ok'); exitDriveMode(); }
}
function exitDriveMode(){
  Drive.on=false;
  if(Drive.watch!=null){ try{navigator.geolocation.clearWatch(Drive.watch);}catch(e){} Drive.watch=null; }
  try{ if(Drive.map){ Drive.map.remove(); Drive.map=null; } }catch(e){}
  const ov=document.getElementById('drive-ov'); if(ov) ov.remove();
  Drive.route=null; Drive.line=null; Drive.myMk=null;
}

/* 🚨 بلاغ مشكلة طريق — بضغطتين مثل Waze */
function openRoadReport(){
  if(!MOD('reports')){ toast(T('mod.off','بلاغات الطرق غير مفعّلة حالياً'),'err'); return; }
  openModal(`<h3>🚨 بلّغ — ساعد كل مستخدمي البُراق</h3>
  <p class="t2" style="font-size:calc(11.5px*var(--fs))">يُثبَّت البلاغ على موقعك الحالي GPS ويظهر للجميع 3 ساعات (ويتجدد بالتأكيدات). تكسب <b>+5 نقاط سكور 🏆</b>.</p>
  <div class="grid2" style="gap:8px;margin-top:10px">
    ${Object.entries(REPORT_TYPES).map(([k,v])=>`<button class="btn btn-ghost" style="justify-content:flex-start" onclick="submitRoadReport('${k}')">${v.ico} ${v.name}</button>`).join('')}
  </div>
  <div class="field" style="margin-top:10px"><label>ملاحظة (اختياري)</label>
    <input class="input" id="rr-note" placeholder="مثال: الجانب الأيمن مغلق"></div>`);
}
function submitRoadReport(type){
  const note=((document.getElementById('rr-note')||{}).value||'').slice(0,80);
  const done=(lat,lng)=>{ Reports.add(type,lat,lng,note); closeModal();
    toast(`${REPORT_TYPES[type].ico} سُجّل بلاغك — شكراً! +5 نقاط 🏆`,'ok'); render(); };
  if(GPS.currentPos){ done(GPS.currentPos.lat, GPS.currentPos.lng); return; }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>done(p.coords.latitude,p.coords.longitude),
      ()=>{ const pv=prov(S.from)||PROVINCES[0]; done(pv.lat,pv.lng); },{enableHighAccuracy:true,timeout:7000});
  } else { const pv=prov(S.from)||PROVINCES[0]; done(pv.lat,pv.lng); }
}

/* ---------- الإدارة المالية الاحترافية للسائق ---------- */
function driverFinancials(me){
  const today=new Date().toISOString().slice(0,10);
  const myLedger=S.ledger.filter(e=>e.driverId===me.id);
  const dayRows=myLedger.filter(e=>e.date===today);
  const weekAgo=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const weekRows=myLedger.filter(e=>e.date>=weekAgo);
  const sum=(rows,f)=>rows.reduce((a,e)=>a+(e[f]||0),0);
  const dayGross=sum(dayRows,'amount'), dayNet=sum(dayRows,'driverShare');
  const weekGross=sum(weekRows,'amount'), weekNet=sum(weekRows,'driverShare');
  return `<div class="card" style="margin-top:12px">
    <div class="section-title" style="margin-top:0"><span class="bar"></span> كشف حسابي المالي</div>
    <div class="grid2">
      <div class="stat"><div class="ic">📅</div><div class="v" style="color:var(--gold);font-size:calc(14px*var(--fs))">${fmt(dayNet)}</div><div class="l">صافي اليوم (${dayRows.length} رحلة)</div></div>
      <div class="stat"><div class="ic">📆</div><div class="v" style="color:var(--cyan);font-size:calc(14px*var(--fs))">${fmt(weekNet)}</div><div class="l">صافي الأسبوع (${weekRows.length} رحلة)</div></div>
    </div>
    <div class="between card soft" style="margin-top:10px"><span class="t2">إجمالي اليوم (قبل العمولة)</span><b>${fmt(dayGross)} د.ع</b></div>
    <div class="between card soft" style="margin-top:8px"><span class="t2">إجمالي الأسبوع</span><b>${fmt(weekGross)} د.ع</b></div>
    <div class="grid2" style="margin-top:10px">
      <button class="btn btn-ghost btn-sm" onclick="openTopUp('سائق')">➕ شحن المحفظة</button>
      <button class="btn btn-ghost btn-sm" onclick="openWithdraw('${me.id}')">🏧 سحب الأرباح</button>
    </div>
  </div>`;
}
function openWithdraw(driverId){
  const me=S.drivers.find(d=>d.id===driverId); if(!me) return;
  openModal(`<h3>🏧 سحب الأرباح</h3>
  <p class="t2" style="font-size:calc(12px*var(--fs))">الرصيد المتاح: <b style="color:var(--gold)">${fmt(me.wallet)} د.ع</b></p>
  <div class="field" style="margin-top:12px"><label>المبلغ المراد سحبه</label><input class="input" id="wd-amt" type="number" placeholder="المبلغ"></div>
  <div class="field"><label>طريقة الاستلام</label><select class="input" id="wd-method"><option>زين كاش</option><option>تحويل بنكي</option><option>نقداً من المكتب</option></select></div>
  <button class="btn btn-primary btn-block" onclick="doWithdraw('${driverId}')">تأكيد طلب السحب</button>`);
}
function doWithdraw(driverId){
  const me=S.drivers.find(d=>d.id===driverId); if(!me) return;
  const amt=parseInt(document.getElementById('wd-amt').value)||0;
  const method=document.getElementById('wd-method').value;
  if(amt<=0||amt>me.wallet){ toast('مبلغ غير صحيح أو يتجاوز رصيدك','err'); return; }
  me.wallet-=amt;
  S.transactions.unshift({id:uid("TX"),role:"سائق",title:`سحب أرباح (${method})`,amount:amt,credit:false,time:"الآن",note:"طلب سحب — قيد المعالجة"});
  saveState(); closeModal(); enqueueSync();
  toast(`تم تسجيل طلب سحب ${fmt(amt)} د.ع عبر ${method} 🏧`,'ok'); render();
}

function setPayPhone(v){
  const d=myDriver(); if(!d) return;
  d.payPhone=(v||'').replace(/[^0-9+]/g,'');
  saveState(); toast('حُفظ رقم استلام التحويل 📱','ok');
}
function setCarStyle(icon,color){
  const d=myDriver(); if(!d) return;
  d.carStyle=d.carStyle||{icon:'🚖',color:CAR_COLORS[0]};
  if(icon) d.carStyle.icon=icon;
  if(color) d.carStyle.color=color;
  saveState(); render(); toast('حُفظ شكل سيارتك على الخريطة 🎨','ok');
}
function toggleBadge(k,on){
  const d=myDriver(); if(!d) return;
  d.badges=d.badges||[];
  if(on&&!d.badges.includes(k)) d.badges.push(k);
  if(!on) d.badges=d.badges.filter(x=>x!==k);
  saveState(); render(); toast(on?`فُعّل: ${zoneBadgeName(k)} 🛂`:'أُلغي التصريح','ok');
}

/* ---------- النسخ الاحتياطي (تصدير/استيراد) ---------- */
function exportBackup(){
  try{
    const data=JSON.stringify(S,null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`safariyat-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('تم تصدير النسخة الاحتياطية 📥','ok');
  }catch(e){ toast('تعذّر التصدير','err'); }
}
function importBackup(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(!data.fin || !data.user){ toast('الملف غير صالح','err'); return; }
        if(confirm('سيحلّ هذا الملف محلّ كل البيانات الحالية. متابعة؟')){
          S=migrateState(data); saveState(); enqueueSync();
          toast('تم استيراد النسخة الاحتياطية بنجاح ✅','ok'); render();
        }
      }catch(e){ toast('تعذّر قراءة الملف — تأكد أنه نسخة سفريات','err'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

function saveStaff(){
  const email=((document.getElementById('st-email')||{}).value||'').trim().toLowerCase();
  const name=((document.getElementById('st-name')||{}).value||'').trim();
  if(!email||!email.includes('@')){ toast('أدخل إيميلاً صحيحاً','err'); return; }
  S.fin.staff=S.fin.staff||[];
  if(S.fin.staff.some(x=>(x.email||'').toLowerCase()===email)){ toast('هذا الإيميل مضاف مسبقاً','err'); return; }
  S.fin.staff.push({email,name}); S.finT=Date.now(); saveState(); closeModal(); render();
  toast(`أُضيف ${name||email} موظف إدارة 👔`,'ok');
  if(navigator.onLine) Cloud.sync(true);
}
function delStaff(email){
  if(!isMaster()) return;
  S.fin.staff=(S.fin.staff||[]).filter(x=>(x.email||'').toLowerCase()!==(email||'').toLowerCase());
  S.finT=Date.now(); saveState(); render(); toast('أُزيل الموظف','ok');
  if(navigator.onLine) Cloud.sync(true);
}

/* تعديل قيمة مالية عامة (سقف الذمّة / رقم التسديد…) — الماستر فقط */
function setFinScalar(key,val){
  if(!isMaster()){ toast('هذه الصلاحية للمدير العام فقط','err'); return; }
  if(key==='debtCap'){ S.fin.debtCap=Math.max(0,parseInt(val)||0); }
  else if(key==='settlePhone'){ S.fin.settlePhone=(val||'').replace(/[^0-9+]/g,''); }
  else { S.fin[key]=val; }
  saveState(); render(); toast('حُفظ الإعداد ⚖️','ok');
}

function updateSchoolFare(){
  const km=parseFloat(document.getElementById('sch-km').value)||5;
  const daily=Pricing.schoolDaily(km);
  const d=document.getElementById('sch-daily'), w=document.getElementById('sch-weekly');
  if(d) d.textContent=fmt(daily)+' د.ع';
  if(w) w.textContent=fmt(daily*5)+' د.ع';
}
function doSchoolBooking(){
  const student=document.getElementById('sch-student').value;
  const parent=document.getElementById('sch-parent').value||S.user.name;
  const phone=document.getElementById('sch-phone').value;
  const school=document.getElementById('sch-school').value;
  const address=document.getElementById('sch-addr').value;
  const km=parseFloat(document.getElementById('sch-km').value)||5;
  if(!student||!school){ toast('أدخل اسم الطالب والمدرسة','err'); return; }
  const daily=Pricing.schoolDaily(km);

function startTaxi(cat){
  cat=cat||'taxi';
  if(!navigator.geolocation){ toast('متصفحك لا يدعم GPS','err'); return; }
  Taximeter.cat=cat;
  Taximeter.start((snap)=>{
    if(snap.gpsLost){ toast('⚠️ '+snap.gpsLost+' — العدّاد مستمر بالزمن وستُقدَّر المسافة 🛡️','warn'); }
    // تحديث أرقام العدّاد مباشرة دون إعادة رسم كامل
    const fEl=document.querySelector('.meter-fare');
    const kmEl=document.getElementById('mtr-km');
    const minEl=document.getElementById('mtr-min');
    if(fEl) fEl.innerHTML=fmt(snap.fare)+' <small>د.ع</small>';
    if(kmEl) kmEl.textContent=snap.km.toFixed(2);
    if(minEl) minEl.textContent=snap.minutes.toFixed(0);
    // ارسم المسار الفعلي على الخريطة
    if(snap.pos){ MapEngine.moveMarker('me', snap.pos.lat, snap.pos.lng); MapEngine.drawPath(snap.path); }
  });
  toast(cat==='moto'?'انطلق عدّاد الدراجة! 🏍️':'انطلق العدّاد! الأجرة تُحسب من مسافتك الفعلية 🚕','ok');
  render();
  // هيّئ الخريطة على الموقع الحالي
  setTimeout(()=>{
    if(!MapEngine.available() || !document.getElementById('live-map')) return;
    navigator.geolocation.getCurrentPosition(p=>{
      const c={lat:p.coords.latitude,lng:p.coords.longitude};
      MapEngine.init('live-map', c, 15);
      MapEngine.addMarker('me', c.lat, c.lng, cat==='moto'?'🏍️':'🚕','موقعك');
    },()=>{},{enableHighAccuracy:true});
  },150);
}
function stopTaxi(){
  const cat=Taximeter.cat||'taxi';
  const snap=Taximeter.stop();
  // 🚖 إغلاق طلب السيارة المرتبط وإضافة زيادة الزبون للأجرة
  const _rid=window._activeRideId;
  if(_rid){
    const rr=(S.rideReqs||[]).find(x=>x.id===_rid);
    if(rr){ snap.fare += (rr.boost||0); Taximeter.fare=snap.fare;
      rr.status='done'; rr.finalFare=snap.fare; rr.doneAt=Date.now();
      S.tripLog=S.tripLog||[];
      S.tripLog.unshift({id:uid('TL'),time:nowTime(),event:'🚖 رحلة سيارة خصوصي',
        route:`${rr.from.label||''} ← ${rr.to.label||''}`, driver:rr.driverName||'—', passengers:rr.paxName||'—', pax:rr.paxName||'—',
        fare:snap.fare, created:nowTime(), gps:`${snap.km.toFixed(1)} كم / ${snap.minutes.toFixed(0)} د`});
      const d=myDriver(); if(d) d.trips=(d.trips||0)+1;
      saveState(); enqueueSync();
    }
    window._activeRideId=null;
  }
  // 🛡️ ملخص النزاهة: الانقطاعات المجسَّرة والإخفاء تُسجَّل وتصل الأدمن
  const gapNote=snap.gaps&&snap.gaps.length
    ? ` · 🛡️ ${snap.gaps.length} انقطاع GPS مجسَّر (+${snap.gapKm} كم مقدَّرة، ${snap.gaps.reduce((a,g)=>a+g.sec,0)} ث)`
    : '';
  const flagNote=snap.flagged?' · 🚩 مريبة — للمراجعة':'';
  // سجّل العملية في محرك الأرباح (تكسي أو دراجة)
  if(snap.fare>0 && snap.km>0.1){
    const b=Finance.breakdown(cat, snap.fare, 'cash');
    Finance.record(b,{driverId:(myDriver()&&myDriver().id)||'unknown', note:`${cat==='moto'?'دراجة':'تكسي'} عدّاد ${snap.km.toFixed(1)} كم${gapNote}${flagNote}`});
    enqueueSync();
  }
  if(snap.flagged){
    S.tripLog=S.tripLog||[];
    S.tripLog.unshift({id:uid('TL'),time:nowTime(),event:'🚩 رحلة عدّاد مريبة',route:`${cat==='moto'?'دراجة':'تكسي'} ${snap.km.toFixed(1)} كم / ${snap.minutes.toFixed(0)} د`,
      driver:(myDriver()&&myDriver().name)||'—', pax:'—',
      note:`انقطاعات GPS: ${snap.gaps.length} (${snap.gaps.reduce((a,g)=>a+g.sec,0)} ث، +${snap.gapKm} كم مقدَّرة) · التطبيق مخفي ${snap.hiddenMin} د`});
    saveState();
    toast('🚩 سُجِّلت الرحلة للمراجعة لدى الإدارة بسبب انقطاعات GPS','warn');
  }
  toast(`انتهت الرحلة — المسافة ${snap.km.toFixed(1)} كم (${snap.gapKm>0?`منها ${snap.gapKm} مقدَّرة 🛡️ · `:''}الزمن ${snap.minutes.toFixed(0)} د)، الأجرة ${fmt(snap.fare)} د.ع ${cat==='moto'?'🏍️':'🚕'}`,'ok');
  render();
}
