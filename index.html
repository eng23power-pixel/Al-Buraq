/* ---------- نظام الثيمات ---------- */
const THEMES = [
  {id:'',       name:'ليلي ذهبي',  dot:'#FBBF24'},
  {id:'royal',  name:'أزرق ملكي',  dot:'#38BDF8'},
  {id:'emerald',name:'أخضر زمردي', dot:'#34D399'},
  {id:'violet', name:'بنفسجي',     dot:'#A78BFA'},
  {id:'crimson',name:'عنّابي',     dot:'#FB7185'},
  {id:'calm',   name:'ليلي هادئ — مريح للعين', dot:'#E8C27A'},
  {id:'ocean',  name:'تركوازي محيطي', dot:'#2DD4BF'},
  {id:'sunset', name:'غروب برتقالي',  dot:'#FB923C'},
  {id:'light',  name:'نهاري فاتح', dot:'#D97706'},
  {id:'sand',   name:'رملي فاتح — مريح جداً للعين', dot:'#D9A441'},
  {id:'dune',   name:'رملي ليلي دافئ', dot:'#E3B465'}
];
function applyTheme(id){
  if(id) document.body.setAttribute('data-theme', id);
  else document.body.removeAttribute('data-theme');
  const mt=document.querySelector('meta[name="theme-color"]');
  const bg=getComputedStyle(document.body).getPropertyValue('--bg-2').trim();
  if(mt&&bg) mt.setAttribute('content', bg);
}
function setTheme(id){
  S.theme=id; saveState(); applyTheme(id);
  const th=THEMES.find(t=>t.id===id);
  toast('تم تطبيق ثيم: '+(th?th.name:'افتراضي')+' 🎨','ok'); render();
}

async function boot(){
  await loadState();
  // 📲 زر التثبيت الأصلي (أندرويد/كروم) — يظهر شريط تثبيت تلقائياً فور جهوزيته
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); window._installEvt=e;
    try{ showInstallBar(); }catch(_){}
  });
  window.addEventListener('appinstalled',()=>{
    window._installEvt=null; hideInstallBar();
    try{ localStorage.setItem('braq_installed','1'); }catch(_){}
    toast('📲 ثُبّت البُراق على جهازك بنجاح ✅','ok');
  });
  // 🌐 الكشف التلقائي عن لغة الهاتف عند أول تشغيل
  if(!S.lang){ S.lang=detectLang(); saveState(); }
  applyLang(S.lang);
  applyTheme(S.theme||'sand');
  applyLaunchShortcut();   // 🔗 اختصارات المتاجر (?go=taxi…)
  document.body.classList.toggle('senior',S.seniorMode);
  // 🛡️ ربط الجهاز — كشف النسخ المستنسخة
  await Sec.checkDevice();
  Reports.pull(); setInterval(()=>Reports.pull(), 120000);
  // 📦 إعلام المستخدم عند وصول نسخة جديدة (يحسم «هل تحدّث المتصفح أم لا؟»)
  if(S.lastVer!==APP_VERSION){ const old=S.lastVer; S.lastVer=APP_VERSION; saveState();
    if(old) setTimeout(()=>toast(`✨ تحدّث التطبيق إلى الإصدار ${APP_VERSION}`,'ok'),900); } // 🚨 مزامنة البلاغات المجتمعية كل دقيقتين
  // تحقق من رابط تفعيل في العنوان
  const lic=await License.readHash();
  if(lic&&lic.valid){ applyLicense(lic.data); }
  render();
  setTimeout(()=>document.getElementById('splash').classList.add('hide'),650);
  // مزامنة دورية صامتة
  // 🕐 ختم زمني تلقائي على كل تعديل للإعدادات/الإعلانات —
  // به يُحسم التعارض بين الأجهزة: التعديل الأحدث يصل الجميع حتى بين جهازي مدير
  ['setRate','setFinField','setPrice','setMethod','setLoyalty','setSurgeMax','setMethodCfg','setPartner','setReq','setFinScalar','saveGarageMgr','delGarageMgr'].forEach(fn=>{
    const orig=window[fn];
    if(typeof orig==='function') window[fn]=function(){ const r=orig.apply(this,arguments); S.finT=Date.now(); saveState(); if(navigator.onLine) Cloud.sync(true); return r; };
  });
  ['saveAd','toggleAd','delAd'].forEach(fn=>{
    const orig=window[fn];
    if(typeof orig==='function') window[fn]=function(){ const r=orig.apply(this,arguments); S.adsT=Date.now(); saveState(); if(navigator.onLine) Cloud.sync(true); return r; };
  });
  Cloud.sync(true);
  setInterval(()=>{ if(navigator.onLine) Cloud.sync(true); }, CONFIG.SYNC_INTERVAL_MS);
  // 🔄 مزامنة تلقائية ذكية: عند عودة الإنترنت، عند العودة للتطبيق، وقبل إغلاقه
  window.addEventListener('online', ()=>{ toast('🌐 عاد الاتصال — تتم المزامنة تلقائياً','info'); Cloud.sync(true); });
  window.addEventListener('offline', ()=>toast('📴 انقطع الاتصال — يعمل التطبيق محلياً وتُحفظ العمليات للمزامنة','warn'));
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && navigator.onLine) Cloud.sync(true); });
  window.addEventListener('beforeunload', ()=>{ try{ if(navigator.onLine) Cloud.sync(true); }catch(e){} });
  // عند عودة النت: ارفع كل العمليات المتراكمة تلقائياً
  window.addEventListener('online', ()=>{ toast('عاد الاتصال — تتم مزامنة العمليات المحفوظة ☁️','info'); Cloud.sync(true); });
  window.addEventListener('offline', ()=>{ toast('انقطع الاتصال — ستُحفظ عملياتك محلياً وتُرفع عند العودة','warn'); });
  // service worker
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
}
window.addEventListener('DOMContentLoaded',boot);
</script>
