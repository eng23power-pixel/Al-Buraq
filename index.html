function doBook(tripId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  const total=t.totalSeats||4;
  if(t.bookedSeats>=total){ toast(`عذراً، المركبة مكتملة (${total}/${total})!`,'warn'); return; }
  const name=(document.getElementById('bk-name').value||S.user.name);
  const payId=document.getElementById('bk-pay').value;
  if(!payId){ toast(T('pay.none','لم يفعّل المدير أي وسيلة دفع بعد'),'err'); return; }
  const payM=payMethodById(payId);
  const pay=payM?payLabel(payM):payId;          // الاسم المقروء يُحفظ مع الراكب
  const isWallet=(payId==='wallet');            // الضمان الإلكتروني فقط
  const effFare=t.farePerSeat+(t.boost||0);
  const lp=loyaltyPct();
  const disc=isWallet?Math.round(effFare*lp/100):0; // خصم الوفاء على الدفع الإلكتروني
  if(isWallet && S.passengerWallet<effFare-disc){ toast('رصيد المحفظة غير كافٍ — اشحن المحفظة أو ادفع نقداً.','err'); return; }
  const seat=t.bookedSeats+1;
  const bkPhone=(document.getElementById('bk-phone')||{}).value||S.user.whatsapp||'';
  t.passengers.push({id:uid("P"),name,seat,pay,fare:effFare,mine:true,phone:bkPhone});
  t.bookedSeats=seat; t.activeForMe=true;
  // 📍 أرسل نقطة انطلاقي للكابتن تلقائياً (موقعي GPS أو النقطة المحددة)
  const _pi=pickupInfo();
  if(_pi && !t.meetPoint){ t.meetPoint={lat:_pi.lat,lng:_pi.lng,by:name,time:nowTime(),label:_pi.src};
    t.chat=t.chat||[]; t.chat.push({by:name,role:'PASSENGER',text:`📍 نقطة انطلاقي (${_pi.src}): https://maps.google.com/?q=${_pi.lat.toFixed(5)},${_pi.lng.toFixed(5)}`,time:nowTime()}); }
  t.status = seat>=total?"مكتملة وجاهزة":"تجميع ركاب";
  if(isWallet){
    S.passengerWallet-=(effFare-disc);
    S.transactions.unshift({id:uid("TX"),role:"مسافر",title:`حجز مقعد (${seat}/${total}) — ${prov(t.from).name.split(' ')[0]} ← ${prov(t.to).name.split(' ')[0]}`,amount:effFare-disc,credit:false,time:"الآن",note:disc?`شمل خصم وفاء ${lp}% (${fmt(disc)} د.ع)`:"محجوز في صندوق الضمان Escrow"});
  }
  // تسجيل العملية في محرك الأرباح + السجل العام (العرض الخاص بعمولة أعلى)
  const cat=t.service==='minibus'?'minibus':'lines';
  const b=Finance.breakdown(cat, effFare, isWallet?'electronic':'cash', {loyaltyDisc:disc, extraPct:t.offerTrip?(S.fin.offerExtra||0):0, rateOverride:tripDriverRate(t)});
  Finance.record(b, {driverId:t.driverId||'unknown', tripId:t.id, note:`حجز مقعد ${seat}/${total}${t.offerTrip?' (عرض خاص)':''}${disc?' · خصم وفاء':''}`});
  logTrip(t,'حجز مقعد');
  S.activeTripId=t.id; saveState(); closeModal();
  // 💳 تحويل الأجرة إلى ماستر كارد الكابتن عبر رقم الهاتف المربوط بالبطاقة + تأكيد واتساب
  const _pm=payM;
  if(_pm && _pm.id!=='cash'){
    const _amt=effFare-disc;
    const _d=tripDriver(t);
    setTimeout(()=>openPayGuide(_pm.id,_amt,{driverPhone:(_d&&(_d.payPhone||_d.phone))||t.driverPhone||'',
      route:`${(prov(t.from)||{}).name||''} ← ${(prov(t.to)||{}).name||''}`}),350);
  }
  toast(seat>=total?`تهانينا! اكتملت المركبة (${total}/${total}) وجاهزة للانطلاق 🚀`:`تم حجز المقعد (${seat}/${total}) بنجاح ✅ — افتح المحادثة لتأكيد التفاصيل مع الكابتن`,'ok');
  enqueueSync(); S.bookingSubTab=1; render();
}
function cancelMyBooking(tripId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  const idx=t.passengers.findIndex(p=>p.mine);
  const fare = idx>=0?t.passengers[idx].fare:t.farePerSeat;
  const wallet = idx>=0?(/محفظة|Escrow/i.test(t.passengers[idx].pay||'')):true;
  // 🛡️ التقدّم الفعلي نحو الوجهة: الأعلى بين GPS السائق وGPS الزبون نفسه —
  // إطفاء أحدهما لا يخفي الآخر، والإلغاء بعد قطع المسافة لا يلغي الحق
  const prog=Math.max(t.progress||0, t.paxProg||0);
  const started=t.driverId && (prog>0.03 || (t.status||'').includes('الطريق'));
  if(started && prog>=0.6){
    // قطعتَ أغلب المسافة — الرحلة تُعتبر مكتملة ولا يصح «الإلغاء» للتهرب
    const cat=t.service==='minibus'?'minibus':(t.service||'lines');
    const b=Finance.breakdown(cat==='line'?'lines':cat, fare, wallet?'electronic':'cash', {rateOverride:tripDriverRate(t)});
    Finance.record(b,{driverId:t.driverId||'unknown', tripId:t.id, note:`🚩 إلغاء بعد قطع ${(prog*100).toFixed(0)}% — احتُسبت مكتملة`});
    S.tripLog=S.tripLog||[];
    S.tripLog.unshift({id:uid('TL'),time:nowTime(),event:'🚩 إلغاء مريب — احتُسبت مكتملة',
      route:`${(prov(t.from)||{}).name||''} ← ${(prov(t.to)||{}).name||''}`,driver:t.driverName||'—',
      pax:(idx>=0?t.passengers[idx].name:S.user.name)||'—',
      note:`التقدّم الفعلي ${(prog*100).toFixed(0)}% (سائق ${((t.progress||0)*100).toFixed(0)}% / زبون ${((t.paxProg||0)*100).toFixed(0)}%)${t.paxGpsOff?' · GPS الزبون كان مطفأً':''} — لا استرداد، والعمولة مسجّلة`});
    if(idx>=0) t.passengers.splice(idx,1);
    t.activeForMe=false; t.status='مكتملة (أُغلقت بالتحقق الجغرافي)';
    saveState(); enqueueSync({type:'cancel_booking',tripId});
    toast(`🛡️ تحقّق GPS: قُطع ${(prog*100).toFixed(0)}% من المسافة — احتُسبت الرحلة مكتملة بلا استرداد، وسُجّلت للإدارة`,'warn'); render(); return;
  }
  let refund=fare, feeNote='إلغاء الحجز قبل الانطلاق';
  if(started){
    // إلغاء أثناء الطريق (أقل من 60%): يُسترد غير المقطوع فقط، وعمولة الجزء المقطوع تُسجَّل
    const ridden=Math.round(fare*prog);
    refund=fare-ridden;
    if(ridden>0){
      const cat=t.service==='minibus'?'minibus':'lines';
      const b=Finance.breakdown(cat, ridden, wallet?'electronic':'cash', {rateOverride:tripDriverRate(t)});
      Finance.record(b,{driverId:t.driverId||'unknown', tripId:t.id, note:`إلغاء أثناء الطريق — حُسب الجزء المقطوع ${(prog*100).toFixed(0)}%`});
    }
    feeNote=`إلغاء أثناء الطريق — خُصم الجزء المقطوع ${(prog*100).toFixed(0)}% (${fmt(ridden)} د.ع)`;
    S.tripLog=S.tripLog||[];
    S.tripLog.unshift({id:uid('TL'),time:nowTime(),event:'⚠️ إلغاء أثناء الطريق',route:`${(prov(t.from)||{}).name||''} ← ${(prov(t.to)||{}).name||''}`,driver:t.driverName||'—',pax:S.user.name||'—',note:feeNote+(t.paxGpsOff?' · GPS الزبون مطفأ':'')});
  }
  if(idx>=0) t.passengers.splice(idx,1);
  t.bookedSeats=Math.max(0,t.bookedSeats-1); t.activeForMe=false; t.status="تجميع ركاب";
  if(wallet && refund>0){ S.passengerWallet+=refund;
    S.transactions.unshift({id:uid("TX"),role:"مسافر",title:"استرداد قيمة تذكرة ملغاة",amount:refund,credit:true,time:"الآن",note:feeNote}); }
  saveState(); toast(started?`أُلغي الحجز — استُرد ${fmt(refund)} د.ع فقط (${feeNote}) ⚖️`:`تم إلغاء الحجز واسترداد ${fmt(refund)} د.ع إلى محفظتك 🔄`,'ok'); enqueueSync({type:'cancel_booking',tripId}); render();
}

  <button class="btn btn-green btn-block" onclick="doBroadcast('${target}')">📲 إرسال البثّ</button>`);

function broadcastRecipients(target){
  // اجمع أرقام واتساب من السائقين والمسافرين (المعروفة)
  let list=[];
  if(target==='drivers'||target==='all'){
    list=list.concat(S.drivers.filter(d=>d.phone).map(d=>({name:d.name,phone:d.phone})));
  }
  if(target==='passengers'||target==='all'){
    // أرقام المسافرين من الركاب المسجّلين في الرحلات
    S.trips.forEach(t=>(t.passengers||[]).forEach(p=>{ if(p.phone) list.push({name:p.name,phone:p.phone}); }));
  }
  // إزالة التكرار
  const seen={}; return list.filter(x=>{ const k=WA.normalize(x.phone); if(seen[k])return false; seen[k]=1; return true; });
}
async function doBroadcast(target){
  const msg=document.getElementById('bc-msg').value;
  if(!msg){ toast('اكتب نص الرسالة','err'); return; }
  const rec=broadcastRecipients(target);
  if(!rec.length){ toast('لا توجد أرقام واتساب مسجّلة لهذه الفئة بعد','warn'); return; }
  closeModal();
  if(WA.autoAvailable()){
    let sent=0;
    for(const r of rec){ if(await WA.send(r.phone, msg)) sent++; }
    toast(`تم إرسال البثّ تلقائياً إلى ${sent}/${rec.length} ✅`,'ok');
  } else {
    // افتح نافذة واتساب للأول، وأعطِ قائمة بالباقي
    WA.open(rec[0].phone, msg);
    toast(`فُتح واتساب لأول رقم. إجمالي ${rec.length} — كرّر لكلٍّ من القائمة.`,'info');
  }
  logEvent('', 'بثّ واتساب', `${target} · ${rec.length} مستلم`);
}
/* ---------- مراقبة السلامة أثناء الرحلة ---------- */
function monitorSafety(t, speed, prevPos, pos){
  // سرعة زائدة
  if(speed>140){ t.safetyAlert=`سرعة زائدة: ${speed} كم/س — يُرجى تنبيه السائق.`;
    logEvent(t.id,'سرعة زائدة',speed+' كم/س'); return; }
  // توقف طويل أثناء "في الطريق"
  if(prevPos && pos){
    const d=Pricing.rawKm(prevPos,pos)*1000;
    if(d<20){ t._stopTicks=(t._stopTicks||0)+1; } else { t._stopTicks=0; }
    if(t._stopTicks>=12){ t.safetyAlert='توقّف طويل غير معتاد — هل كل شيء بخير؟';
      logEvent(t.id,'توقف طويل','> دقيقتين'); t._stopTicks=0; }
  }
}
function logEvent(tripId, kind, detail){
  S.events.unshift({id:uid("EV"), tripId, kind, detail, time:nowTime(), date:new Date().toISOString().slice(0,10)});
  if(S.events.length>300) S.events.length=300;
  saveState();
}

/* تتبّع + محاكاة */
let simTimer=null;
function trackTrip(id){ S.activeTripId=id; S.tab=1; saveState(); render(); }
function startTrip(id){
  const t=S.trips.find(x=>x.id===id); if(!t) return;
  const from=prov(t.from), to=prov(t.to);
  // تتبّع GPS حقيقي فقط — بدون أي محاكاة
  const gpsOk = GPS.start(
    (pos, speed, acc) => {
      t.speed = speed;
      // حساب التقدّم من الموقع الحقيقي (المسافة المقطوعة / الكلية)
      const doneDist = Pricing.distanceKm(from, {lat:pos.lat,lng:pos.lng});
      const remain = Pricing.distanceKm({lat:pos.lat,lng:pos.lng}, to);
      t.progress = Math.min(1, Math.max(0, doneDist/((doneDist+remain)||1)));
      t.currentLat=pos.lat; t.currentLng=pos.lng;
      MapEngine.moveMarker(S.role==='DRIVER'?'driver':'me', pos.lat, pos.lng);
      // مكافحة تزوير GPS
      const ok = GPS.validatePosition(GPS._prevPos, pos, 5000);
      S.gpsIntegrity = ok ? `GPS حقيقي ✓ — دقة ${acc}م` : '⚠️ حركة غير طبيعية — موثّقة للتدقيق';
      // مراقبة السلامة (سرعة زائدة / توقف طويل)
      monitorSafety(t, speed, GPS._prevPos, pos);
      GPS._prevPos = pos;
      if(remain < 1 || t.progress>=0.99){
        t.status="تم الوصول"; t.progress=1; t.speed=0; stopTrip(); saveState(); render();
        toast('الحمد لله على السلامة! تم الوصول إلى الوجهة 🏁','ok');
        if(S.role==='PASSENGER') setTimeout(()=>openReview(t.driverName, from.name.split(' ')[0]+' ← '+to.name.split(' ')[0]),700);
        return;
      }
      saveState(); if(S.tab===1) render();
    },
    (err) => {
      t.status="تجميع ركاب"; stopTrip(); saveState(); render();
      toast('⚠️ ' + err + ' — فعّل خدمة الموقع (GPS) للمتابعة', 'err');
    }
  );
  if(!gpsOk){ toast('متصفحك لا يدعم GPS — لا يمكن التتبّع المباشر','err'); return; }
  t.status="في الطريق";
  toast('انطلقت الرحلة! التتبّع المباشر بنظام GPS الحقيقي مفعّل 🛰️','ok');
  enqueueSync({type:'trip_start',tripId:id}); saveState(); render();
}
function stopTrip(){
  if(simTimer){ clearInterval(simTimer); simTimer=null; }
  GPS.stop();
}

  const t=S.trips.find(x=>x.id===id); const pr=t.progress||0;
  const earned=Math.max(5000,Math.round(t.farePerSeat*pr)), refund=Math.max(0,t.farePerSeat-earned);
  S.passengerWallet+=refund;
  S.transactions.unshift({id:uid("TX"),role:"مسافر",title:"استرجاع مالي مرحلي بنظام GPS",amount:refund,credit:true,time:"الآن",note:`استرداد ${Math.round((1-pr)*100)}% بعد نزول وسيط`});
  saveState(); closeModal(); toast(`تم النزول المبكّر. أُعيد ${fmt(refund)} د.ع إلى محفظتك 💳`,'ok'); render();

function triggerSOS(){
  const t=activeTrip(); if(t){ t.sos=true; saveState(); }
  const loc = GPS.currentPos ? `(${GPS.currentPos.lat.toFixed(4)}, ${GPS.currentPos.lng.toFixed(4)})` : 'جارٍ تحديد الموقع';
  toast('🆘 أُطلق نداء الطوارئ SOS! الموقع الحالي: '+loc+' — أُرسل للجهات المسجّلة.','err');
  enqueueSync({type:'sos', tripId:t?t.id:null, pos:GPS.currentPos});
}
function dispatchBackup(id){
  const t=S.trips.find(x=>x.id===id); if(!t) return;
  // ابحث عن سائق بديل مسجّل (غير السائق الحالي)
  const backup=S.drivers.find(d=>d.id!==t.driverId && d.online);
  if(backup){
    t.driverId=backup.id; t.driverName=backup.name; t.driverPhone=backup.phone; t.carModel=backup.car; t.carPlate=backup.plate; t.driverRating=backup.rating; t.status="تجميع ركاب";
    toast('⚠️ تخلّف السائق — استُدعي السائق البديل '+backup.name+' آلياً.','warn');
  } else {
    t.driverId=null; t.driverName="بانتظار سائق بديل"; t.status="تجميع ركاب";
    toast('⚠️ تخلّف السائق — لا يوجد سائق بديل متاح حالياً، أُعيد نشر الرحلة.','warn');
  }
  saveState(); enqueueSync({type:'dispatch_backup',tripId:id}); render();
}

function doTopUp(role,amt){
  if(!amt||amt<=0){ toast('أدخل مبلغاً صحيحاً','warn'); return; }
  if(role==='سائق'){ const me=myDriver(); if(me) me.wallet=(me.wallet||0)+amt; }
  else S.passengerWallet+=amt;
  S.transactions.unshift({id:uid("TX"),role,title:"شحن رصيد محفظة إلكترونية",amount:amt,credit:true,time:"الآن",note:"شحن عبر زين كاش / بطاقة"});

function lockDeposit(){
  const amt=25000; const me=myDriver();
  if(!me){ toast('سجّل كسائق أولاً','err'); return; }
  if((me.wallet||0)<amt){ toast('رصيد محفظة السائق غير كافٍ للتأمين — اشحن أولاً.','err'); return; }
  me.wallet-=amt; me.deposit=(me.deposit||0)+amt;
  S.transactions.unshift({id:uid("TX"),role:"سائق",title:"إيداع تأمين ما قبل الانطلاق",amount:amt,credit:false,time:"الآن",note:"تأمين التزام السائق لضمان سلامة الركاب"});

      ${d.boost?`<div class="pill green" style="margin-top:6px">⬆️ ${T('dr.boost','زيادة من الزبون')} +${fmt(d.boost)} د.ع</div>`:''}
      <div class="grid3" style="margin-top:10px;gap:8px">
        <button class="btn btn-cyan btn-sm" onclick="navToRide('${d.id}')">🧭 ${T('dr.nav','ملاحة')}</button>
        <button class="btn btn-ghost btn-sm" onclick="openRideChat('${d.id}')">💬 ${T('chatBtn','محادثة')}</button>
        <button class="btn btn-green btn-sm" onclick="openCallOptions('${d.paxPhone||''}','${(d.paxName||'').replace(/'/g,'')}')">📞 ${T('call','اتصال')}</button>
      </div>
      ${d.status==='accepted'
        ? `<button class="btn btn-primary btn-block" style="margin-top:10px" onclick="startRideMeter('${d.id}')">▶️ ${T('dr.start','صعد الزبون — ابدأ العدّاد')}</button>
           <button class="btn btn-ghost btn-block btn-sm" style="margin-top:8px" onclick="dropRide('${d.id}')">✖️ ${T('dr.drop','تعذّر — أعد الطلب للكباتن')}</button>`
        : `<button class="btn btn-danger btn-block" style="margin-top:10px" onclick="stopTaxi()">⏹️ ${T('dr.finish','إنهاء الرحلة واستلام الأجرة')}</button>`}
    </div>`;
  }
  const L=driverLoc(me);
  const reqs=rideList()
    .filter(r=>r.status==='searching' && !(r.declined||[]).includes(me.id))
    .map(r=>({r, km:Pricing.rawKm(r.from,L)}))
    .filter(x=>x.km<=RIDE_RADIUS_KM)
    .sort((a,b)=>(b.r.boost||0)-(a.r.boost||0) || a.km-b.km);
  return `<div class="section-title"><span class="bar"></span> 🚖 ${T('dr.requests','طلبات سيارة قريبة منك')} (${reqs.length})</div>
  ${L.approx?`<div class="pill gold" style="width:100%;justify-content:center;margin-bottom:8px;font-size:calc(9.5px*var(--fs))">📍 ${T('dr.shareGps','شارك موقعك GPS ليصلك أقرب الطلبات بدقة')} — <button class="btn btn-ghost btn-sm" style="padding:2px 8px;margin-inline-start:6px" onclick="shareDriverLoc()">${T('dr.shareBtn','شارك الآن')}</button></div>`:''}
  ${reqs.length?reqs.map(({r,km})=>`<div class="trip" ${r.boost?'style="border-color:rgba(251,191,36,.6)"':''}><div class="glow"></div>
    <div class="trip-head"><div class="trip-route">🧍 ${r.paxName}</div>
      <div class="fare">${fmt(r.estFare+(r.boost||0))} <small>د.ع</small></div></div>
    <div class="t2" style="font-size:calc(11px*var(--fs));margin-top:4px">📍 ${r.from.label||''}</div>
    <div class="t2" style="font-size:calc(11px*var(--fs))">🎯 ${r.to.label||''}</div>
    <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">
      <span class="pill green">🚗 ${km.toFixed(1)} كم ${T('dr.fromYou','عنك')}</span>
      <span class="pill cyan">📏 ${r.km} كم ${T('dr.tripLen','طول الرحلة')}</span>
      ${r.boost?`<span class="pill gold">⬆️ +${fmt(r.boost)}</span>`:''}
    </div>
    <div class="grid2" style="margin-top:10px;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="declineRide('${r.id}')">✖️ ${T('dr.decline','تخطّي')}</button>
      <button class="btn btn-primary btn-sm" onclick="acceptRide('${r.id}')">✅ ${T('dr.accept','قبول الطلب')}</button>
    </div>
  </div>`).join(''):`<div class="card soft" style="text-align:center;color:var(--muted);font-size:calc(11px*var(--fs))">${T('dr.none','لا طلبات قريبة الآن — ستصلك فور طلب أي زبون قريب منك.')}</div>`}`;
}
function acceptRide(id){
  const me=myDriver(); if(!me){ toast('سجّل كسائق أولاً','err'); return; }
  if(driverBlocked(me.id)){ toast(`⛔ ${T('dr.blocked','الخدمة محجوبة — سدّد ذمّتك أولاً')}`,'err'); payDriverDebt(me.id); return; }
  const r=(S.rideReqs||[]).find(x=>x.id===id);
  if(!r){ toast(T('dr.gone','انتهى الطلب'),'err'); render(); return; }
  if(r.status!=='searching'){ toast(T('dr.taken','سبقك كابتن آخر إلى هذا الطلب'),'warn'); render(); return; }
  r.status='accepted'; r.driverId=me.id; r.driverName=me.name; r.acceptedAt=Date.now();
  saveState(); enqueueSync({type:'ride_accept',id}); render(); notifyFx('ok');
  toast(`✅ ${T('dr.took','قبلت الطلب')} — ${T('dr.goTo','توجّه إلى')} ${r.from.label||''}`,'ok');
}
function declineRide(id){
  const me=myDriver(); if(!me) return;
  const r=(S.rideReqs||[]).find(x=>x.id===id); if(!r) return;
  r.declined=r.declined||[]; if(!r.declined.includes(me.id)) r.declined.push(me.id);
  saveState(); render();
}
function dropRide(id){
  const r=(S.rideReqs||[]).find(x=>x.id===id); if(!r) return;
  r.status='searching'; r.declined=r.declined||[];
  if(r.driverId&&!r.declined.includes(r.driverId)) r.declined.push(r.driverId);
  r.driverId=null; r.driverName=''; r.t=Date.now();
  saveState(); enqueueSync(); render(); toast(T('dr.returned','أُعيد الطلب لبقية الكباتن'),'info');
}
function navToRide(id){
  const r=(S.rideReqs||[]).find(x=>x.id===id); if(!r) return;
  const dest=r.status==='ongoing'?r.to:r.from;
  openNavTo(dest.lat,dest.lng, r.status==='ongoing'?(r.to.label||'الوجهة'):(r.from.label||'نقطة الزبون'));
}
function startRideMeter(id){
  const r=(S.rideReqs||[]).find(x=>x.id===id); if(!r) return;
  r.status='ongoing'; r.startedAt=Date.now(); saveState(); enqueueSync();
  window._activeRideId=id;
  startTaxi('taxi');
  toast(`▶️ ${T('dr.meterOn','بدأ العدّاد — رحلة موفقة')}`,'ok');
}
/* 📡 مشاركة موقع الكابتن ليظهر للزبائن القريبين */
let _drvLocWatch=null;
function shareDriverLoc(){
  const me=myDriver(); if(!me||!navigator.geolocation){ toast('GPS غير متاح','err'); return; }
  if(_drvLocWatch!=null){ toast(T('dr.sharing','موقعك يُشارَك بالفعل 📡'),'info'); return; }
  _drvLocWatch=navigator.geolocation.watchPosition(p=>{
    const d=myDriver(); if(!d) return;
    d.loc={lat:p.coords.latitude,lng:p.coords.longitude,t:Date.now()};
    saveState();
  },()=>{},{enableHighAccuracy:true,maximumAge:15000});
  toast(`📡 ${T('dr.shared','يُشارَك موقعك الآن — ستصلك الطلبات الأقرب إليك')}`,'ok');
  setTimeout(render,1200);
}
function stopDriverLoc(){ if(_drvLocWatch!=null){ try{navigator.geolocation.clearWatch(_drvLocWatch);}catch(e){} _drvLocWatch=null; } }

function acceptTrip(id){
  const t=S.trips.find(x=>x.id===id); if(!t)return;
  const me=myDriver();
  if(!me){ toast('سجّل كسائق أولاً لقبول الرحلات','err'); return; }
  if(driverBlocked(me.id)){ toast(`⛔ الخدمة محجوبة — ذمّتك ${fmt(driverDebt(me.id))} د.ع تجاوزت السقف ${fmt(debtCap())} د.ع. سدّد أولاً.`,'err'); payDriverDebt(me.id); return; }
  if(t.service==='vip' && (me.vehType||'car')!=='vip'){ toast('حجوزات VIP تُقبل فقط من كباتن VIP بسيارات حديثة مميزة ⭐','err'); return; }
  t.driverId=me.id; t.driverName=me.name; t.driverPhone=me.phone; t.carModel=me.car; t.carPlate=me.plate; t.driverRating=me.rating;
  const total=t.totalSeats||4;
  t.status=t.service==='vip'?'كابتنك الخاص نشِط ⭐':t.service==='parcel'?'المندوب في الطريق للاستلام':(t.bookedSeats>=total?"مكتملة وجاهزة":"بانتظار اكتمال الركاب");
  me.trips=(me.trips||0)+1;
  // العدالة المثالية: بعد قبول رحلة ينتقل الكابتن لآخر طابور فئته (تناوب عادل)
  const sameCat=S.drivers.filter(d=>(d.vehType||'car')===(me.vehType||'car'));
  me.queue=Math.max(...sameCat.map(d=>d.queue||0))+1;
  sameCat.sort((a,b)=>(a.queue||0)-(b.queue||0)).forEach((d,i)=>d.queue=i+1);
  logTrip(t,'قبول كابتن');
  saveState(); toast('تم قبول وتثبيت الرحلة — جهّز مركبتك للانطلاق 🚗 (انتقل دورك لنهاية طابور فئتك بالعدل)','ok'); enqueueSync({type:'accept_trip',tripId:id,driverId:me.id}); render();
}

es:`<div class="card soft" style="margin-bottom:8px"><b>🧍 Para pasajeros:</b><br>
1. Elige un servicio en la pantalla principal (líneas, coche privado, moto, VIP, escuela, paquetes).<br>

6. Al llegar confirma el pago — el importe se libera tras la confirmación de ambas partes.</div>
<div class="card soft" style="margin-bottom:8px"><b>🧑‍✈️ Para capitanes:</b><br>

3. Acepta el viaje, habla con los pasajeros en el chat e inicia el rastreo GPS.<br>

5. En los cobros en efectivo, la comisión se registra como deuda que pagas a la administración.</div>
<div class="card soft"><b>⭐ Servicio VIP:</b> un capitán con coche moderno premium a tu disposición por horas.<br>
<b>🎒 Escuelas:</b> suscripción semanal (dom.–jue.), ida y vuelta, con conductor fijo y doble garantía.<br>
<b>❄️ Regla de oro:</b> todos los vehículos llevan aire acondicionado, salvo las motos.</div>`

const TERMS={
ar:['<b>1) طبيعة الخدمة:</b> «البُراق» منصّة تقنية وسيطة تربط المسافرين بكباتن مستقلين. المنصّة ليست ناقلاً ولا مالكاً للمركبات، والكابتن متعاقد مستقل يتحمّل مسؤولية قيادته ومركبته وصلاحية أوراقه القانونية (إجازة السوق، التسجيل، التأمين).',
'<b>2) حدود المسؤولية:</b> لا تتحمّل إدارة المنصّة المسؤولية عن الحوادث المرورية أو الأضرار أو التأخير أو فقدان الممتلكات أثناء الرحلات؛ وتنحصر مسؤوليتها في تشغيل المنصّة والوساطة المالية الموثّقة. استخدامك للتطبيق إقرار بذلك.',
'<b>3) الدفع والضمان:</b> المبالغ المدفوعة إلكترونياً تُحفظ في ضمان (Escrow) ولا تُحرَّر للكابتن إلا بعد تأكيد الطرفين إتمام الرحلة المرتبط بتحقق GPS. عمولة المنصّة ونِسَبها معلنة في التطبيق وقابلة للتغيير بإشعار.',
'<b>4) السلوك والالتزام:</b> يلتزم الطرفان بالاحترام المتبادل وأنظمة المرور. يحق للإدارة إيقاف أي حساب يسيء الاستخدام أو يزوّر البيانات أو GPS، وإحالة النزاعات للإدارة القانونية.',
'<b>5) البيانات والخصوصية:</b> تُسجَّل الرحلات والمحادثات الداخلية والمواقع لأغراض الأمان وفضّ النزاعات، ومن حق الإدارة الاطلاع عليها. وثائق الكباتن (إجازة السوق) تُعرض للإدارة حصراً ولا تظهر للمسافرين.',
'<b>6) الإلغاء والاسترداد:</b> يخضع الإلغاء لسياسة الاسترداد المعلنة؛ وقد تُخصم رسوم عند الإلغاء المتأخر تعويضاً للكابتن.',
'<b>8) التفتيش القانوني للحقائب والطرود:</b> يقرّ المسافر والكابتن بأن الحقائب والأمتعة والطرود المنقولة خاضعة للتفتيش من السيطرات والجهات الأمنية المخوّلة قانوناً. كل طرف مسؤول حصراً عن محتويات أمتعته، وإدارة المنصّة غير مسؤولة قانونياً عنها.',
'<b>9) القانون الواجب:</b> تخضع هذه الشروط للقوانين النافذة في جمهورية العراق، وأي نزاع يُحال للجهات المختصة بعد تعذّر الحل ودياً عبر الإدارة.'],
en:['<b>1) Nature of the service:</b> “AlBuraq” is an intermediary technology platform connecting passengers with independent captains. The platform is neither a carrier nor an owner of vehicles; the captain is an independent contractor responsible for his driving, his vehicle and the validity of his legal papers (driving license, registration, insurance).',
'<b>2) Limitation of liability:</b> The platform administration bears no responsibility for traffic accidents, damages, delays or loss of property during trips; its responsibility is limited to operating the platform and documented financial intermediation. Your use of the app constitutes acceptance of this.',
'<b>3) Payment and escrow:</b> Amounts paid electronically are held in escrow and released to the captain only after both parties confirm trip completion, verified by GPS. The platform commission and its rates are published in the app and may change with notice.',
'<b>4) Conduct and compliance:</b> Both parties commit to mutual respect and traffic regulations. Management may suspend any account that abuses the service or falsifies data or GPS, and refer disputes to legal administration.',
'<b>5) Data and privacy:</b> Trips, internal chats and locations are logged for safety and dispute resolution, and management has the right to review them. Captains’ documents (driving license) are shown to management exclusively and never to passengers.',
'<b>6) Cancellation and refund:</b> Cancellation follows the published refund policy; a fee may be deducted for late cancellation as compensation to the captain.',
'<b>8) Legal inspection of bags and parcels:</b> The passenger and the captain acknowledge that bags, luggage and parcels carried are subject to inspection by checkpoints and legally authorised security bodies. Each party is solely responsible for the contents of his own luggage, and the platform administration bears no legal responsibility for them.',
'<b>9) Governing law:</b> These terms are governed by the laws in force in the Republic of Iraq, and any dispute is referred to the competent authorities after amicable resolution through management proves impossible.'],
ku:['<b>1) سروشتی خزمەتگوزاری:</b> «بوراق» پلاتفۆرمێکی تەکنەلۆژیای ناوەندگیرە کە گەشتیاران بە کاپتنە سەربەخۆکان دەبەستێتەوە. پلاتفۆرم گواستنەوەکار یان خاوەنی ئۆتۆمبێل نییە؛ کاپتن گرێبەستکارێکی سەربەخۆیە و بەرپرسە لە لێخوڕین و ئۆتۆمبێل و بەڵگەنامە یاساییەکانی.',
'<b>2) سنووری بەرپرسیارێتی:</b> بەڕێوەبەرایەتی پلاتفۆرم بەرپرسیار نییە لە ڕووداوی هاتوچۆ، زیان، دواکەوتن یان ونبوونی موڵک لە کاتی گەشتدا؛ بەرپرسیارێتی تەنها لە کارپێکردنی پلاتفۆرم و ناوەندگیری داراییە.',
'<b>3) پارەدان و دڵنیایی:</b> پارەی ئەلیکترۆنی لە دڵنیایی (Escrow) دەمێنێتەوە و تەنها دوای پشتڕاستکردنەوەی هەردوولا و GPS بۆ کاپتن ئازاد دەکرێت. کۆمیسیۆن لە ئەپدا ڕاگەیەنراوە و بە ئاگادارکردنەوە دەگۆڕێت.',
'<b>4) ڕەفتار و پابەندبوون:</b> هەردوولا پابەندن بە ڕێزی هاوبەش و یاساکانی هاتوچۆ. بەڕێوەبەرایەتی بۆی هەیە هەر هەژمارێک ڕابگرێت کە خراپ بەکاری دێنێت یان داتا و GPS ساختە دەکات.',
'<b>5) داتا و تایبەتمەندی:</b> گەشت و گفتوگۆ و شوێنەکان بۆ ئاسایش و چارەسەری ناکۆکی تۆمار دەکرێن و بەڕێوەبەرایەتی بۆی هەیە سەیریان بکات. بەڵگەنامەی کاپتن تەنها بۆ بەڕێوەبەرایەتییە.',
'<b>6) هەڵوەشاندنەوە و گەڕاندنەوەی پارە:</b> هەڵوەشاندنەوە بەپێی سیاسەتی ڕاگەیەنراوە؛ لە هەڵوەشاندنەوەی دواکەوتوو کرێیەک دەبڕدرێت وەک قەرەبوو بۆ کاپتن.',
'<b>8) پشکنینی یاسایی جانتا و پاکێج:</b> گەشتیار و کاپتن دان بەوەدا دەنێن کە جانتا و پاکێجەکان پشکنینیان بۆ دەکرێت لەلایەن خاڵە ئەمنییەکان. هەر لایەک بەرپرسی ناوەڕۆکی خۆیەتی و پلاتفۆرم بەرپرسیار نییە.',
'<b>9) یاسای کارپێکراو:</b> ئەم مەرجانە ژێر یاسای کۆماری عێراقن و هەر ناکۆکییەک دوای شکستی چارەسەری دۆستانە بۆ لایەنی پەیوەندیدار دەنێردرێت.'],
tr:['<b>1) Hizmetin niteliği:</b> “AlBuraq”, yolcuları bağımsız kaptanlarla buluşturan aracı bir teknoloji platformudur. Platform ne taşıyıcı ne de araç sahibidir; kaptan, sürüşünden, aracından ve yasal evrakının geçerliliğinden (ehliyet, ruhsat, sigorta) sorumlu bağımsız bir yüklenicidir.',
'<b>2) Sorumluluğun sınırı:</b> Platform yönetimi; seferler sırasındaki trafik kazaları, hasarlar, gecikmeler veya eşya kaybından sorumlu değildir. Sorumluluğu, platformun işletilmesi ve belgelenmiş mali aracılıkla sınırlıdır. Uygulamayı kullanmanız bunu kabul ettiğiniz anlamına gelir.',
'<b>3) Ödeme ve güvence:</b> Elektronik ödemeler güvencede (Escrow) tutulur ve yalnızca iki taraf GPS doğrulamalı tamamlanmayı onayladıktan sonra kaptana aktarılır. Komisyon ve oranları uygulamada ilan edilir, bildirimle değişebilir.',
'<b>4) Davranış ve uyum:</b> Taraflar karşılıklı saygıya ve trafik kurallarına uyar. Yönetim, kötüye kullanan ya da veri/GPS sahteciliği yapan hesabı askıya alabilir ve uyuşmazlıkları hukuk birimine iletebilir.',
'<b>5) Veri ve gizlilik:</b> Seferler, uygulama içi sohbetler ve konumlar güvenlik ve uyuşmazlık çözümü için kaydedilir; yönetim bunları inceleyebilir. Kaptan belgeleri (ehliyet) yalnızca yönetime gösterilir, yolculara asla.',
'<b>6) İptal ve iade:</b> İptal, ilan edilen iade politikasına tabidir; geç iptalde kaptana tazminat olarak ücret kesilebilir.',
'<b>8) Çanta ve kolilerin yasal denetimi:</b> Yolcu ve kaptan, taşınan çanta, bagaj ve kolilerin kontrol noktaları ve yetkili güvenlik birimlerince aranabileceğini kabul eder. Her taraf yalnızca kendi bagajının içeriğinden sorumludur; yönetimin yasal sorumluluğu yoktur.',
'<b>9) Uygulanacak hukuk:</b> Bu şartlar Irak Cumhuriyeti’nde yürürlükteki yasalara tabidir; dostane çözüm sağlanamazsa uyuşmazlık yetkili mercilere iletilir.'],
fa:['<b>۱) ماهیت خدمت:</b> «بُراق» یک پلتفرم فناوری واسط است که مسافران را به کاپیتان‌های مستقل وصل می‌کند. پلتفرم حمل‌کننده یا مالک خودرو نیست؛ کاپیتان پیمانکار مستقل و مسئول رانندگی، خودرو و اعتبار مدارک قانونی خود (گواهینامه، سند، بیمه) است.',
'<b>۲) حدود مسئولیت:</b> مدیریت پلتفرم مسئول تصادفات، خسارات، تأخیر یا گم شدن اموال در سفر نیست؛ مسئولیت آن به اداره پلتفرم و واسطه‌گری مالی مستند محدود است. استفاده شما از برنامه پذیرش این شرط است.',
'<b>۳) پرداخت و ضمانت:</b> مبالغ الکترونیکی در ضمانت (Escrow) نگه داشته می‌شود و تنها پس از تأیید دو طرف و تأیید GPS به کاپیتان آزاد می‌شود. کمیسیون و نرخ‌ها در برنامه اعلام شده و با اطلاع قابل تغییر است.',
'<b>۴) رفتار و پایبندی:</b> دو طرف به احترام متقابل و مقررات راهنمایی پایبندند. مدیریت می‌تواند حساب متخلف یا جعل‌کننده داده و GPS را مسدود و اختلاف را به واحد حقوقی ارجاع دهد.',
'<b>۵) داده و حریم خصوصی:</b> سفرها، گفتگوهای داخلی و موقعیت‌ها برای ایمنی و حل اختلاف ثبت می‌شوند و مدیریت حق بررسی دارد. مدارک کاپیتان (گواهینامه) تنها به مدیریت نشان داده می‌شود نه مسافران.',
'<b>۶) لغو و بازگشت وجه:</b> لغو تابع سیاست اعلام‌شده است؛ در لغو دیرهنگام ممکن است مبلغی به‌عنوان جبران کاپیتان کسر شود.',
'<b>۸) بازرسی قانونی کیف و بسته:</b> مسافر و کاپیتان می‌پذیرند که کیف‌ها، بار و بسته‌های حمل‌شده مشمول بازرسی ایست‌ها و نهادهای امنیتی مجازند. هر طرف تنها مسئول محتوای بار خود است و مدیریت مسئولیت حقوقی ندارد.',
'<b>۹) قانون حاکم:</b> این شرایط تابع قوانین جاری جمهوری عراق است و هر اختلاف پس از ناکامی حل دوستانه به مراجع ذی‌صلاح ارجاع می‌شود.'],
fr:['<b>1) Nature du service :</b> « AlBuraq » est une plateforme technologique d’intermédiation reliant les passagers à des capitaines indépendants. La plateforme n’est ni transporteur ni propriétaire des véhicules ; le capitaine est un prestataire indépendant responsable de sa conduite, de son véhicule et de la validité de ses documents légaux (permis, carte grise, assurance).',
'<b>2) Limitation de responsabilité :</b> L’administration n’assume aucune responsabilité pour les accidents, dommages, retards ou pertes de biens durant les trajets ; sa responsabilité se limite à l’exploitation de la plateforme et à l’intermédiation financière documentée. L’usage de l’application vaut acceptation.',
'<b>3) Paiement et séquestre :</b> Les montants payés électroniquement sont placés sous séquestre et libérés au capitaine uniquement après confirmation des deux parties, vérifiée par GPS. La commission et ses taux sont publiés dans l’application et modifiables avec préavis.',
'<b>4) Conduite et conformité :</b> Les deux parties s’engagent au respect mutuel et au code de la route. L’administration peut suspendre tout compte abusif ou falsifiant les données ou le GPS, et porter les litiges au service juridique.',
'<b>5) Données et confidentialité :</b> Trajets, discussions internes et positions sont enregistrés pour la sécurité et le règlement des litiges, et l’administration peut les consulter. Les documents des capitaines (permis) ne sont visibles que par l’administration, jamais par les passagers.',
'<b>6) Annulation et remboursement :</b> L’annulation suit la politique publiée ; des frais peuvent être retenus en cas d’annulation tardive, en compensation du capitaine.',
'<b>8) Inspection légale des bagages et colis :</b> Le passager et le capitaine reconnaissent que les bagages et colis transportés sont soumis à l’inspection des points de contrôle et des autorités habilitées. Chaque partie est seule responsable du contenu de ses bagages ; l’administration n’en est pas juridiquement responsable.',
'<b>9) Droit applicable :</b> Les présentes conditions sont régies par les lois en vigueur en République d’Irak ; tout litige est porté devant les autorités compétentes si le règlement amiable échoue.'],
es:['<b>1) Naturaleza del servicio:</b> «AlBuraq» es una plataforma tecnológica intermediaria que conecta pasajeros con capitanes independientes. La plataforma no es transportista ni propietaria de los vehículos; el capitán es un contratista independiente responsable de su conducción, su vehículo y la validez de sus documentos legales (licencia, registro, seguro).',
'<b>2) Límite de responsabilidad:</b> La administración no asume responsabilidad por accidentes, daños, retrasos o pérdida de bienes durante los viajes; su responsabilidad se limita a operar la plataforma y a la intermediación financiera documentada. El uso de la app implica su aceptación.',
'<b>3) Pago y garantía:</b> Los importes pagados electrónicamente quedan en garantía (Escrow) y se liberan al capitán solo tras la confirmación de ambas partes, verificada por GPS. La comisión y sus tasas se publican en la app y pueden cambiar con aviso.',
'<b>4) Conducta y cumplimiento:</b> Ambas partes se comprometen al respeto mutuo y a las normas de tránsito. La administración puede suspender cualquier cuenta abusiva o que falsifique datos o GPS, y derivar las disputas al área legal.',
'<b>5) Datos y privacidad:</b> Viajes, chats internos y ubicaciones se registran por seguridad y para resolver disputas, y la administración puede revisarlos. Los documentos del capitán (licencia) se muestran solo a la administración, nunca a los pasajeros.',
'<b>6) Cancelación y reembolso:</b> La cancelación sigue la política publicada; puede deducirse una tarifa por cancelación tardía como compensación al capitán.',
'<b>8) Inspección legal de equipaje y paquetes:</b> El pasajero y el capitán reconocen que el equipaje y los paquetes transportados están sujetos a inspección en los controles y por las autoridades competentes. Cada parte es responsable exclusiva del contenido de su equipaje; la administración no es responsable legal.',
'<b>9) Ley aplicable:</b> Estas condiciones se rigen por las leyes vigentes en la República de Irak; cualquier disputa se remite a las autoridades competentes si falla la solución amistosa.']

function requireTermsAcceptance(){

  <p class="t2" style="font-size:calc(12px*var(--fs))">قبل استخدام البُراق، اطّلع ووافق على الشروط الرسمية:</p>
  ${termsHTML()}
  <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="S.termsAccepted=nowTime();saveState();closeModal();toast('شكراً لموافقتك — أهلاً بك في البُراق ✅','ok')">✅ قرأت وأوافق على الشروط والأحكام</button>`);
}

/* ======================================================================
   السجل العام للرحلات — كل رحلة بكامل معلوماتها (وصول الأدمن حصراً)
   ====================================================================== */
function logTrip(t, event){
  S.tripLog=S.tripLog||[];
  let e=S.tripLog.find(x=>x.tripId===t.id);
  const data={
    tripId:t.id, service:t.service||'lines',
    route:prov(t.from).name.split(' ')[0]+' ← '+prov(t.to).name.split(' ')[0],
    passengers:(t.passengers||[]).map(p=>p.name).join('، ')||'—',
    driver:t.driverName||'—', driverId:t.driverId||'',
    fare:t.farePerSeat, seats:t.bookedSeats+'/'+(t.totalSeats||4),
    status:t.status, lastEvent:event, gps:S.gpsIntegrity,
    settled:!!t.settled, time:nowTime(), date:new Date().toISOString().slice(0,10)
  };
  if(e) Object.assign(e, data, {updated:nowTime()});
  else S.tripLog.unshift(Object.assign({created:nowTime()}, data));
  if(S.tripLog.length>300) S.tripLog.length=300;
}
/* 📜 سجل رحلاتي — نسخة الزبون/الكابتن (قراءة فقط، لا حذف) */
function openMyTrips(){
  const name=(S.user.name||'').trim();

/* ======================================================================
   محادثة تأكيد الحجز بين الزبون والكابتن — الإدارة تطّلع عليها
   ====================================================================== */
function openTripChat(tripId, adminView){
  if(!MOD('chat')){ toast(T('mod.off','المحادثة غير مفعّلة حالياً'),'err'); return; }
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  t.chat=t.chat||[];
  const isAdminViewer=adminView&&isMaster();
  const myRole=S.role==='DRIVER'?'كابتن':'مسافر';
  // 🔁 ترجمة ثنائية الاتجاه حسب لغة القارئ:
  // الكابتن (عربي) يرى ترجمة عربية لرسائل الأجنبي، والمسافر الأجنبي يرى
  // رسائل الكابتن العربية مترجمةً للغته — كلٌّ يقرأ بلغته الأم.
  const vl=curLang();
  const msgs=t.chat.map(m=>{
    let trLine='';
    if(vl==='ar'){ if(m.ar && !hasArabic(m.text)) trLine=m.ar; }
    else if(hasArabic(m.text)){ trLine=(m.tx&&m.tx[vl])||'⏳'; }
    return `<div style="display:flex;${m.role==='كابتن'?'justify-content:flex-start':'justify-content:flex-end'};margin-bottom:8px">
    <div style="max-width:80%;padding:8px 12px;border-radius:14px;font-size:calc(12px*var(--fs));line-height:1.6;
      ${m.role==='كابتن'?'background:var(--surface-3);border-bottom-right-radius:4px':'background:var(--gold);color:#1a1200;border-bottom-left-radius:4px'}">
      <div style="font-size:calc(9px*var(--fs));opacity:.7;margin-bottom:2px">${m.role==='كابتن'?'🧑‍✈️':'🧍'} ${m.name||m.role} · ${m.time}</div>${(m.text||'').replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>')}
      ${trLine?`<div style="margin-top:5px;padding-top:5px;border-top:1px dashed rgba(127,127,127,.4);font-size:calc(11px*var(--fs))" dir="auto">🔁 ${trLine==='⏳'?'<span class="muted">…</span>':trLine}</div>`:''}</div></div>`;
  }).join('');
  chatTranslatePending(t); // املأ الترجمات الناقصة بالخلفية ثم حدّث
  const other=tripOtherParty(t);
  openModal(`<h3>💬 محادثة الرحلة ${isAdminViewer?'(اطلاع إداري)':''}</h3>
  <div class="between"><div class="t2" style="font-size:calc(10.5px*var(--fs))">${prov(t.from).name.split(' ')[0]} ← ${prov(t.to).name.split(' ')[0]} · ${t.driverName}</div>
    ${isAdminViewer?'':`<div class="row" style="gap:6px">
      <button class="btn btn-green btn-sm" onclick="openCallOptions('${other.phone||''}','${(other.name||'').replace(/'/g,'')}')">📞 صوتي</button>
      <button class="btn btn-cyan btn-sm" onclick="openMeetPoint('${tripId}')">📍 نقطة التقاء</button>
    </div>`}</div>
  ${t.meetPoint?`<div class="pill green" style="width:100%;justify-content:center;margin-top:6px;font-size:calc(10px*var(--fs))">📍 نقطة التقاء محددة (${t.meetPoint.by}) — <a href="https://maps.google.com/?q=${t.meetPoint.lat},${t.meetPoint.lng}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;margin-inline-start:4px">افتحها بالخرائط</a></div>`:''}
  <div class="muted" style="font-size:calc(9.5px*var(--fs));margin-top:4px">🛡️ محادثة موثّقة ومن حق الإدارة الاطلاع عليها · 🔁 الرسائل غير العربية تُترجم تلقائياً</div>
  <div id="chat-box" style="max-height:45vh;overflow-y:auto;margin:12px 0;padding:4px">${msgs||'<div class="muted" style="text-align:center;padding:16px;font-size:calc(11px*var(--fs))">ابدأ المحادثة لتأكيد تفاصيل الحجز — نقطة الالتقاء، الموعد، الأمتعة…</div>'}</div>
  ${isAdminViewer?'':`<div class="row" style="gap:8px">
    <input class="input" id="chat-input" placeholder="اكتب رسالتك…" style="flex:1" onkeydown="if(event.key==='Enter')sendTripChat('${tripId}')">
    <button class="btn btn-primary btn-sm" onclick="sendTripChat('${tripId}')">إرسال</button></div>
  <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">
    ${(myRole==='مسافر'?['أين نقطة الالتقاء؟','كم موعد الانطلاق؟','معي حقائب إضافية','أنا في الطريق إليك']
      :['أنا في نقطة الانطلاق','سأصل خلال 10 دقائق','أرسل موقعك من فضلك','جاهزون للانطلاق']).map(q=>`<button class="btn btn-ghost btn-sm" style="font-size:calc(10px*var(--fs))" onclick="document.getElementById('chat-input').value='${q}';sendTripChat('${tripId}')">${q}</button>`).join('')}
  </div>`}
  <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="closeModal()">إغلاق</button>`);
  setTimeout(()=>{ const b=document.getElementById('chat-box'); if(b) b.scrollTop=b.scrollHeight; },100);
}
/* يملأ ترجمات الرسائل الناقصة بلغة القارئ الحالي (مع تخزينها على الرسالة) */
const TR_CODE={ku:'ckb'}; // السورانية في مترجم Google
let _chatTrBusy=false;
async function chatTranslatePending(t){
  if(_chatTrBusy || !CONFIG.APPS_SCRIPT_URL) return;
  const vl=curLang();
  const jobs=[];
  (t.chat||[]).slice(-25).forEach(m=>{
    if(vl==='ar'){ if(!hasArabic(m.text) && !m.ar) jobs.push({m, tgt:'ar', slot:'ar'}); }
    else if(hasArabic(m.text) && !(m.tx&&m.tx[vl])) jobs.push({m, tgt:TR_CODE[vl]||vl, slot:vl});
  });
  if(!jobs.length) return;
  _chatTrBusy=true;
  let changed=false;
  for(const j of jobs.slice(0,8)){
    const tr=await autoTranslate(j.m.text, j.tgt);
    if(tr && tr!==j.m.text){
      if(j.slot==='ar') j.m.ar=tr;
      else { j.m.tx=j.m.tx||{}; j.m.tx[j.slot]=tr; }
      changed=true;
    } else if(j.slot!=='ar'){ j.m.tx=j.m.tx||{}; j.m.tx[j.slot]=j.m.text; } // فشل = اعرض الأصل بدل ⏳
  }
  _chatTrBusy=false;
  if(changed){ saveState(); }
  if(document.getElementById('chat-box')) openTripChat(t.id, undefined);
}
function sendTripChat(tripId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  const inp=document.getElementById('chat-input'); if(!inp) return;
  const text=(inp.value||'').trim(); if(!text) return;
  t.chat=t.chat||[];
  const m={role:S.role==='DRIVER'?'كابتن':'مسافر', name:S.user.name||'', text, time:nowTime()};
  t.chat.push(m);
  saveState(); enqueueSync({type:'chat',tripId});
  openTripChat(tripId); // أعد فتح المحادثة محدّثة
  // 🔁 ترجمة تلقائية للعربية إن كانت الرسالة بلغة أخرى
  if(!hasArabic(text)){
    autoTranslate(text,'ar').then(tr=>{
      if(tr && tr!==text){ m.ar=tr; saveState();
        if(document.getElementById('chat-box')) openTripChat(tripId);
      }
    });
  }
}

/* ======================================================================
   أمان الدفع المرتبط بـ GPS — تأكيد مزدوج بين الكابتن والمسافر
   يضمن حق الإدارة (العمولة) والكابتن (أجرته) والمسافر (وصوله)
   ====================================================================== */
function PaymentConfirmCard(t){
  if(t.settled) return `<div class="pill green" style="width:100%;justify-content:center;margin-top:12px">✅ سُوّيت الأجرة وحُرّرت المبالغ بعدالة — شكراً لكم</div>`;
  if(t.status!=='تم الوصول') return '';
  const gpsOk = t.progress>=0.99;
  return `<div class="card" style="margin-top:12px;border-color:rgba(16,185,129,.45);background:linear-gradient(160deg,rgba(16,185,129,.1),var(--surface))">
    <div style="font-weight:900;font-size:calc(14px*var(--fs))">🔐 تأكيد إتمام الرحلة والدفع</div>
    <div class="t2" style="font-size:calc(11.5px*var(--fs));margin-top:6px;line-height:1.8">
      🛰️ تحقق GPS: ${gpsOk?'<b style="color:var(--green)">الوصول للوجهة مؤكد موقعياً ✓</b>':'الموقع قيد التحقق…'}<br>
      الأجرة: <b style="color:var(--gold)">${fmt(t.farePerSeat*Math.max(1,t.bookedSeats))} د.ع</b> — تُحرَّر للكابتن بعد تأكيد الطرفين</div>
    <div class="grid2" style="margin-top:10px">
      <button class="btn ${t.paxConfirmed?'btn-green':'btn-primary'} btn-sm" ${t.paxConfirmed?'disabled':''} onclick="confirmTripPayment('${t.id}','pax')">${t.paxConfirmed?'✓ أكّد المسافر':'🧍 أؤكد الوصول والدفع'}</button>
      <button class="btn ${t.drvConfirmed?'btn-green':'btn-cyan'} btn-sm" ${t.drvConfirmed?'disabled':''} onclick="confirmTripPayment('${t.id}','drv')">${t.drvConfirmed?'✓ أكّد الكابتن':'🧑‍✈️ أؤكد الاستلام'}</button>
    </div>
    <div class="muted" style="font-size:calc(9.5px*var(--fs));margin-top:8px;text-align:center">عند اكتمال التأكيدين: حصة الكابتن لمحفظته، وعمولة المنصّة للإدارة — موثّقة في السجل العام</div>
  </div>`;
}
function confirmTripPayment(tripId, who){
  const t=S.trips.find(x=>x.id===tripId); if(!t||t.settled) return;
  if(who==='pax'){
    if(S.role==='DRIVER'){ toast('هذا التأكيد للمسافر','err'); return; }
    t.paxConfirmed=true; toast('شكراً! سجّلنا تأكيدك للوصول والدفع ✅','ok');
  } else {
    if(S.role!=='DRIVER' && !isMaster()){ toast('هذا التأكيد للكابتن','err'); return; }
    t.drvConfirmed=true; toast('سجّلنا تأكيد الكابتن لاستلام الأجرة ✅','ok');
  }
  if(t.paxConfirmed && t.drvConfirmed){ settleTrip(t); }
  saveState(); enqueueSync({type:'pay_confirm',tripId,who}); render();
}
function settleTrip(t){
  // 📈 تعلّم: سجّل الزمن الفعلي للمسار من رحلات المستخدمين
  try{ if(t.goT && t.from && t.to && t.from!==t.to){ RouteLearn.record(t.from, t.to, (Date.now()-t.goT)/60000); } }catch(e){}
  // التسوية العادلة: حصة الكابتن + عمولة المنصّة (المسجّلة مسبقاً عند الحجز — لا ازدواج)
  const total=t.farePerSeat*Math.max(1,t.bookedSeats);
  const cat=t.service==='minibus'?'minibus':t.service==='vip'?'vip':t.service==='school'?'school':t.service==='parcel'?'parcel':'lines';
  const payMethod=(t.passengers||[]).some(p=>(p.pay||'').includes('نقد'))?'cash':'electronic';
  const b=Finance.breakdown(cat, total, payMethod, {extraPct: t.offerTrip?(S.fin.offerExtra||0):0, rateOverride:tripDriverRate(t)});
  const d=S.drivers.find(x=>x.id===t.driverId);
  if(d && payMethod==='electronic'){ d.wallet=(d.wallet||0)+b.driverShare; }
  t.settled=true; t.settledAt=nowTime();
  // عدّاد الوفاء: رحلة مكتملة للزبون المستمر
  if((t.passengers||[]).some(p=>p.mine)){ S.myTripsCount=(S.myTripsCount||0)+1; }
  logTrip(t,'تسوية نهائية — تأكيد مزدوج');
  toast(`⚖️ تمت التسوية العادلة: ${fmt(b.driverShare)} د.ع للكابتن${t.offerTrip?' (عرض خاص — عمولة أعلى)':''} · العمولة للمنصّة`,'ok');
}

/* ======================================================================
   خصم الوفاء — للزبون المستمر كثير التنقل (يُمتَص من عمولة المنصّة)
   ====================================================================== */
function loyaltyPct(){
  if(!MOD('loyalty')) return 0;
  const L=S.fin.loyalty||{t1Trips:10,t1Pct:3,t2Trips:25,t2Pct:5,t3Trips:50,t3Pct:7};
  const n=S.myTripsCount||0;
  if(n>=L.t3Trips) return L.t3Pct;
  if(n>=L.t2Trips) return L.t2Pct;
  if(n>=L.t1Trips) return L.t1Pct;
  return 0;
}

function applyBoost(tripId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  const amt=Math.max(0, parseInt(document.getElementById('boost-amt').value)||0);
  t.boost=amt;
  saveState(); closeModal(); enqueueSync({type:'boost',tripId,amt});
  toast(amt>0?`⚡ أُضيف عرض زيادة ${fmt(amt)} د.ع — طلبك الآن مميز أمام الكباتن`:'أُلغيت الزيادة','ok'); render();
}

/* ======================================================================
   🚘 حجز المركبة كاملة — خصوصية تامة للمسافر وعائلته
   ====================================================================== */
function bookFullCar(tripId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  const total=t.totalSeats||4;
  const remaining=total-t.bookedSeats;
  if(remaining<=0){ toast('المركبة مكتملة','warn'); return; }
  const fare=(t.farePerSeat+(t.boost||0))*remaining;
  const lp=loyaltyPct();
  const disc=Math.round(fare*lp/100);
  openModal(`<h3>🚘 حجز المركبة كاملة</h3>
  <p class="t2" style="font-size:calc(12px*var(--fs))">تحجز كل المقاعد المتبقية (${remaining}) لك ولعائلتك — خصوصية تامة وانطلاق فوري دون انتظار اكتمال الركاب.</p>
  <div class="between card soft" style="margin:10px 0"><span>${remaining} مقاعد × ${fmt(t.farePerSeat+(t.boost||0))}</span><b style="color:var(--gold)">${fmt(fare)} د.ع</b></div>
  ${disc>0?`<div class="between card soft" style="margin-bottom:10px"><span>🎖️ خصم وفاء ${lp}% (زبون مستمر)</span><b style="color:var(--green)">− ${fmt(disc)} د.ع</b></div>`:''}
  ${inspectNotice()}
  <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="doBookFull('${tripId}')">تأكيد حجز المركبة كاملة — ${fmt(fare-disc)} د.ع</button>`);
}
function doBookFull(tripId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  const total=t.totalSeats||4;
  const remaining=total-t.bookedSeats; if(remaining<=0) return;
  const unit=t.farePerSeat+(t.boost||0);
  const fare=unit*remaining;
  const lp=loyaltyPct(); const disc=Math.round(fare*lp/100);
  if(S.passengerWallet<fare-disc){ toast('رصيد المحفظة غير كافٍ — اشحن أو ادفع نقداً عند الصعود','err'); return; }
  S.passengerWallet-=(fare-disc);
  for(let i=0;i<remaining;i++){ t.passengers.push({id:uid("P"),name:(S.user.name||'زبون')+(i?` (مقعد ${t.bookedSeats+i+1})`:''),seat:t.bookedSeats+i+1,pay:'محفظة إلكترونية',fare:unit,mine:true}); }
  t.bookedSeats=total; t.fullBooked=true; t.activeForMe=true; t.status='محجوزة كاملة — خصوصية';
  S.transactions.unshift({id:uid("TX"),role:"مسافر",title:`حجز مركبة كاملة (${remaining} مقاعد)`,amount:fare-disc,credit:false,time:"الآن",note:disc?`شمل خصم وفاء ${fmt(disc)} د.ع`:"محجوز بالضمان"});
  const cat=t.service==='minibus'?'minibus':'lines';
  const b=Finance.breakdown(cat, fare, 'electronic', {loyaltyDisc:disc, rateOverride:tripDriverRate(t)});
  Finance.record(b,{driverId:t.driverId||'unknown', tripId:t.id, note:`حجز كامل ${remaining} مقاعد`});
  logTrip(t,'حجز مركبة كاملة');
  S.activeTripId=t.id; saveState(); closeModal(); enqueueSync({type:'full_book',tripId});
  toast('🚘 المركبة كلها لك! خصوصية تامة وجاهزة للانطلاق فور قبول الكابتن','ok');
  S.bookingSubTab=1; render();
}

function bidFloor(t){ return Math.round((t.farePerSeat*(S.fin.minBidPct||85)/100)/250)*250; }
function openBidModal(tripId){
  if(!MOD('bids')){ toast(T('mod.off','عروض الكباتن غير مفعّلة حالياً'),'err'); return; }
  const t=S.trips.find(x=>x.id===tripId); if(!t||t.driverId) return;
  const me=myDriver(); if(!me){ toast('سجّل ككابتن أولاً','err'); return; }
  const floor=bidFloor(t);
  openModal(`<h3>🤝 قدّم عرض سعر أدنى</h3>
  <p class="t2" style="font-size:calc(12px*var(--fs))">الأجرة المعلنة: <b style="color:var(--gold)">${fmt(t.farePerSeat+(t.boost||0))} د.ع</b> للمقعد.<br>
  حدّ العدالة: لا يمكن النزول تحت <b>${fmt(floor)} د.ع</b> (${S.fin.minBidPct}%) — حمايةً للكباتن من حرب أسعار مدمّرة.</p>
  <div class="field" style="margin-top:12px"><label>عرضك للمقعد (د.ع)</label><input class="input" id="bid-amt" type="number" value="${floor}" min="${floor}" style="text-align:center"></div>
  <div class="muted" style="font-size:calc(10px*var(--fs));margin-bottom:10px">📍 يُعرض للمسافر مع بُعدك عنه — الأقرب والأنسب سعراً يُختار بعدالة</div>
  <button class="btn btn-primary btn-block" onclick="submitBid('${tripId}')">إرسال العرض للمسافر</button>`);
}
function submitBid(tripId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  const me=myDriver(); if(!me) return;
  const floor=bidFloor(t);
  const amt=parseInt(document.getElementById('bid-amt').value)||0;
  if(amt<floor){ toast(`⚖️ حدّ العدالة: لا يمكن النزول تحت ${fmt(floor)} د.ع`,'err'); return; }
  if(amt>t.farePerSeat+(t.boost||0)){ toast('عرضك أعلى من الأجرة المعلنة — اقبل الرحلة مباشرة بدلاً من العرض','warn'); return; }
  // بُعد الكابتن عن نقطة انطلاق المسافر (GPS إن توفّر، وإلا مركز المحافظة)
  const from=prov(t.from);
  const myPos=GPS.currentPos|| (me.province? (PROVINCES.find(p=>p.name===me.province)||from) : from);
  const dist=+(Pricing.rawKm({lat:myPos.lat,lng:myPos.lng},{lat:from.lat,lng:from.lng})).toFixed(1);
  t.bids=t.bids||[];
  const ex=t.bids.find(b=>b.driverId===me.id);
  const bid={driverId:me.id,name:me.name,photo:me.photo||'',rating:me.rating,car:me.car,fare:amt,distKm:dist,time:nowTime()};
  if(ex) Object.assign(ex,bid); else t.bids.push(bid);
  saveState(); closeModal(); enqueueSync({type:'bid',tripId,driverId:me.id,amt});
  toast(`أُرسل عرضك (${fmt(amt)} د.ع · على بُعد ${dist} كم) للمسافر 🤝`,'ok'); render();
}
function openBidsList(tripId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  const bids=(t.bids||[]).slice().sort((a,b)=> (a.fare-b.fare) || (a.distKm-b.distKm));
  openModal(`<h3>🤝 عروض الكباتن (${bids.length})</h3>
  <p class="t2" style="font-size:calc(11.5px*var(--fs))">مرتّبة بعدالة: الأفضل سعراً ثم الأقرب إليك. الأجرة المعلنة ${fmt(t.farePerSeat+(t.boost||0))} د.ع.</p>
  <div style="max-height:50vh;overflow-y:auto;margin-top:10px">
  ${bids.length?bids.map(b=>`<div class="card soft" style="margin-bottom:8px">
    <div class="between"><div class="row">
      ${b.photo?`<img src="${b.photo}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)">`:'<div class="avatar">🧑‍✈️</div>'}
      <div><b style="font-size:calc(12.5px*var(--fs))">${b.name}</b><div class="t2" style="font-size:calc(10.5px*var(--fs))">⭐ ${b.rating} · ${b.car||''} · 📍 يبعد ${b.distKm} كم</div></div></div>
      <div style="text-align:left"><div style="font-weight:900;color:var(--green);font-size:calc(15px*var(--fs))">${fmt(b.fare)}</div><div class="muted" style="font-size:calc(9px*var(--fs))">د.ع/مقعد</div></div></div>
    <button class="btn btn-green btn-sm btn-block" style="margin-top:8px" onclick="acceptBid('${tripId}','${b.driverId}')">✅ قبول هذا العرض</button>
  </div>`).join(''):`<div class="card soft" style="text-align:center;color:var(--muted)">لا عروض بعد — جرّب ⚡ زيادة الأجرة لجذب الكباتن.</div>`}
  </div>
  <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="closeModal()">إغلاق</button>`);
}
function acceptBid(tripId, driverId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;
  const bid=(t.bids||[]).find(b=>b.driverId===driverId); if(!bid) return;
  const d=S.drivers.find(x=>x.id===driverId);
  const oldFare=t.farePerSeat;
  t.farePerSeat=bid.fare; t.boost=0;
  // ردّ الفرق لمحفظة من دفع مسبقاً
  (t.passengers||[]).forEach(p=>{ if(p.mine && (p.pay||'').includes('محفظة') && p.fare>bid.fare){ S.passengerWallet+=(p.fare-bid.fare); p.fare=bid.fare; } });
  if(d){ t.driverId=d.id; t.driverName=d.name; t.driverPhone=d.phone; t.carModel=d.car; t.carPlate=d.plate; t.driverRating=d.rating; }
  t.status=t.bookedSeats>=(t.totalSeats||4)?'مكتملة وجاهزة':'بانتظار اكتمال الركاب';
  logTrip(t,'قبول عرض كابتن أدنى');
  saveState(); closeModal(); enqueueSync({type:'bid_accept',tripId,driverId});
  toast(`✅ قُبل عرض ${bid.name} بـ ${fmt(bid.fare)} د.ع — وُفِّر لك ${fmt(oldFare-bid.fare)} د.ع للمقعد`,'ok'); render();
}

function openGlossary(){

  openModal(`<h3>📚 ${T('doc.gloss','تعريفات البُراق')}</h3>
  <div style="max-height:60vh;overflow-y:auto;margin-top:10px">
  ${defs.map(([t,d])=>`<div class="card soft" style="margin-bottom:8px;padding:10px"><b style="font-size:calc(12.5px*var(--fs))">${t}</b><div class="t2" style="font-size:calc(11px*var(--fs));margin-top:4px;line-height:1.8">${d}</div></div>`).join('')}

  <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="closeModal()">${T('ok1','فهمت')}</button>`);
}

function requestRouteChange(tripId){
  const t=S.trips.find(x=>x.id===tripId); if(!t) return;

  const detail=document.getElementById('rc-detail').value||'';

    approvals:[], total:Math.max(1,t.bookedSeats), time:nowTime(), by:t.driverName };
  saveState(); closeModal();
  toast('أُرسل طلب تغيير المسار لجميع الركاب — بانتظار موافقتهم ⏳','info');
  enqueueSync({type:'route_change_request',tripId,rc:t.routeChange}); render();
}
function respondRouteChange(tripId, approve){
  const t=S.trips.find(x=>x.id===tripId); if(!t||!t.routeChange) return;
  const rc=t.routeChange;
  if(approve){
    if(!rc.approvals.includes(S.user.email||'me')) rc.approvals.push(S.user.email||'me');
    if(rc.approvals.length>=rc.total){ rc.status='approved';
      toast('✅ وافق جميع الركاب — تم اعتماد تغيير المسار','ok'); }
    else { toast(`تم تسجيل موافقتك (${rc.approvals.length}/${rc.total}) — بانتظار باقي الركاب`,'ok'); }
  } else {
    rc.status='rejected';
    toast('❌ رفضتَ تغيير المسار — سيُبلَّغ السائق بالالتزام بالطريق الأصلي','warn');
  }
  saveState(); enqueueSync({type:'route_change_response',tripId,approve,by:S.user.email}); render();
}

function handleGoogleSignIn(response){
  // Decode JWT ID token from Google
  try {
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    const email = payload.email;
    const name = payload.name || payload.given_name || 'مستخدم Google';
    const picture = payload.picture || '';
    const roleSelect = document.getElementById('si-role');
    const role = roleSelect ? roleSelect.value : 'مسافر';
    const wa = (document.getElementById('si-wa')||{}).value || '';
    if(!wa){ // رقم واتساب إجباري — اطلبه بعد مصادقة Google
      promptWhatsApp(email, name, role, picture); return;
    }
    completeSignIn(email, name, role, picture, wa);
  } catch(e) {
    toast('خطأ في معالجة بيانات Google — حاول مجدداً','err');
  }
}
let _pendingSignIn=null; // بيانات Google بانتظار رقم الواتساب
function promptWhatsApp(email, name, role, picture){
  _pendingSignIn={email,name,role,picture};
  const required=REQ('waRequired');
  openModal(`<h3>📲 رقم واتساب${required?' <span style="color:var(--red);font-size:.7em">(إلزامي)</span>':''}</h3>
  <p class="t2" style="font-size:calc(12px*var(--fs))">أهلاً <b>${name||''}</b>! ${required?'أدخل رقم واتساب فعّالاً لإكمال التسجيل — تصلك عليه تنبيهات الرحلات.':'أدخل رقم واتساب لاستقبال تنبيهات الرحلات — أو تخطَّ الآن وأضفه لاحقاً من «حسابي».'}</p>
  <div class="field" style="margin-top:12px"><label>رقم واتساب${required?' *':' (يُفضَّل)'}</label>
    <input class="input" id="wa-prompt" placeholder="07xxxxxxxxx" inputmode="tel" style="text-align:center;letter-spacing:1px"></div>
  <button class="btn btn-primary btn-block" id="wa-confirm-btn">${REQ('waVerify')?'📨 إرسال رمز التحقق':'✅ تأكيد والدخول'}</button>
  ${required?'':'<button class="btn btn-ghost btn-block" style="margin-top:8px" id="wa-skip-btn">⏭️ تخطّي الآن — الدخول بدون رقم</button>'}`);
  setTimeout(()=>{
    const el=document.getElementById('wa-prompt');
    const bC=document.getElementById('wa-confirm-btn');
    const bS=document.getElementById('wa-skip-btn');
    if(bC) bC.addEventListener('click', confirmWhatsAppSignIn);
    if(bS) bS.addEventListener('click', skipWhatsAppSignIn);
    if(el){ el.focus(); el.addEventListener('keydown', ev=>{ if(ev.key==='Enter') confirmWhatsAppSignIn(); }); }
  },150);
}
function confirmWhatsAppSignIn(){
  const w=(document.getElementById('wa-prompt')||{}).value||'';
  const clean=w.replace(/[^0-9+]/g,'');
  if(!clean){
    if(REQ('waRequired')){ toast('رقم واتساب إلزامي لإكمال التسجيل','err'); return; }
    skipWhatsAppSignIn(); return; // اختياري + حقل فارغ = تخطٍّ
  }
  if(clean.replace(/\D/g,'').length<10){ toast('أدخل رقم واتساب صحيحاً (07xxxxxxxxx)','err'); return; }
  if(!_pendingSignIn){ toast('انتهت الجلسة — أعد تسجيل الدخول','err'); closeModal(); return; }
  if(REQ('waVerify')){ startWaOtp(clean,'signin'); return; }
  const p=_pendingSignIn; _pendingSignIn=null;
  completeSignIn(p.email, p.name, p.role, p.picture, clean);
}

/* ---------- تحقق واتساب برمز OTP ---------- */
let _waOtp=null; // {code, number, mode:'signin'|'edit', tries, sentAuto}
function genOtp(){ return String(Math.floor(100000+Math.random()*900000)); }
async function startWaOtp(number, mode){
  _waOtp={code:genOtp(), number, mode:mode||'signin', tries:0, sentAuto:false};
  const msg=`رمز تأكيد البُراق: ${_waOtp.code}\nلا تشاركه مع أحد. صالح لهذه الجلسة فقط.`;
  _waOtp.sentAuto = await WA.send(number, msg); // تلقائي عبر WhatsApp Business API إن ضُبط
  openWaOtpModal();
  if(_waOtp.sentAuto) toast('أُرسل رمز التحقق إلى واتساب رقمك 📨','ok');
}
function openWaOtpModal(){
  if(!_waOtp) return;
  const o=_waOtp;
  openModal(`<h3>🔐 تأكيد رقم الواتساب</h3>
  <p class="t2" style="font-size:calc(12px*var(--fs))">للتأكد أن الرقم <b dir="ltr">${o.number}</b> لك ويعمل على واتساب:</p>
  ${o.sentAuto
    ? `<div class="pill green" style="width:100%;justify-content:center;margin:10px 0">📨 أُرسل الرمز تلقائياً إلى واتساب رقمك</div>`
    : `<div class="t2" style="font-size:calc(11.5px*var(--fs));margin:10px 0;line-height:1.8">1) اضغط الزر الأخضر — يفتح واتساب برسالة تحوي رمزك.<br>2) أرسلها إلى نفسك (الرقم أعلاه) — وصولها يثبت أن الرقم يعمل.<br>3) انسخ الرمز من الرسالة وأدخله هنا.</div>
       <button class="btn btn-green btn-block" onclick="WA.open('${o.number}','رمز تأكيد البُراق: ${o.code}')">🟢 فتح واتساب لاستلام الرمز</button>`}
  <div class="field" style="margin-top:12px"><label>رمز التحقق (6 أرقام)</label>
    <input class="input" id="wa-otp" placeholder="••••••" inputmode="numeric" maxlength="6" style="text-align:center;letter-spacing:8px;font-size:calc(20px*var(--fs));font-weight:800"></div>
  <button class="btn btn-primary btn-block" id="wa-otp-btn">✅ تحقق وأكمل</button>
  <button class="btn btn-ghost btn-sm btn-block" style="margin-top:8px" onclick="resendWaOtp()">🔄 إعادة إرسال رمز جديد</button>`);
  setTimeout(()=>{
    const el=document.getElementById('wa-otp'), b=document.getElementById('wa-otp-btn');
    if(b) b.addEventListener('click', verifyWaOtp);
    if(el){ el.focus(); el.addEventListener('keydown',ev=>{ if(ev.key==='Enter') verifyWaOtp(); }); }
  },150);
}
async function resendWaOtp(){
  if(!_waOtp) return;
  _waOtp.code=genOtp(); _waOtp.tries=0;
  _waOtp.sentAuto=await WA.send(_waOtp.number, `رمز تأكيد البُراق: ${_waOtp.code}`);
  openWaOtpModal(); toast('أُنشئ رمز جديد 🔄','info');
}
function verifyWaOtp(){
  if(!_waOtp){ toast('انتهت الجلسة — أعد المحاولة','err'); closeModal(); return; }
  const v=((document.getElementById('wa-otp')||{}).value||'').replace(/\D/g,'');
  if(v!==_waOtp.code){
    _waOtp.tries++;
    if(_waOtp.tries>=5){ _waOtp=null; _pendingSignIn=null; closeModal(); toast('محاولات كثيرة خاطئة — أعد تسجيل الدخول','err'); return; }
    toast('الرمز غير صحيح — تحقق من رسالة واتساب','err'); return;
  }
  const o=_waOtp; _waOtp=null;
  if(o.mode==='edit'){
    S.user.whatsapp=o.number; S.user.waVerified=true; saveState(); closeModal(); render();
    toast('تم تأكيد رقم الواتساب وحفظه ✓📲','ok'); return;
  }
  if(!_pendingSignIn){ toast('انتهت الجلسة — أعد تسجيل الدخول','err'); closeModal(); return; }
  const p=_pendingSignIn; _pendingSignIn=null;
  completeSignIn(p.email, p.name, p.role, p.picture, o.number);
  S.user.waVerified=true; saveState();
}

function skipWhatsAppSignIn(){
  if(!_pendingSignIn){ toast('انتهت الجلسة — أعد تسجيل الدخول','err'); closeModal(); return; }

  completeSignIn(p.email, p.name, p.role, p.picture, '');
  toast('يمكنك إضافة رقم واتساب لاحقاً من «حسابي» 📲','info');
}
function doSignIn(){
  const email=(document.getElementById('si-email').value||'').trim();
  const name=document.getElementById('si-name').value||'مستخدم';
  const role=document.getElementById('si-role').value;
  const wa=(document.getElementById('si-wa')||{}).value||'';
  if(!email){ toast('أدخل البريد الإلكتروني','err'); return; }
  if(!wa){
    if(REQ('waRequired')){ toast('رقم واتساب إلزامي للتسجيل','err'); return; }
    toast('دخلت بدون رقم واتساب — أضفه لاحقاً من «حسابي» 📲','info');
  } else if(REQ('waVerify')){
    _pendingSignIn={email,name,role,picture:''}; startWaOtp(wa.replace(/[^0-9+]/g,''),'signin'); return;
  }
  completeSignIn(email, name, role, '', wa);
}
function completeSignIn(email, name, role, picture, whatsapp){
  const admin=isAdminEmail(email);
  const tm=(CONFIG.TRANSPORT_MANAGER_EMAIL||'').toLowerCase();
  const gmHit=((S.fin&&S.fin.garageManagers)||[]).find(g=>(g.email||'').toLowerCase()===email.toLowerCase());
  const isGarage = (tm && email.toLowerCase()===tm) || !!gmHit;
  const prevLicType=S.user.licType||'';
  const prevProvince=S.user.province||'';
  const wa=whatsapp||S.user.whatsapp||'';
  if(admin){
    S.user={email,name:'م. أحمد — المدير العام',role:'مدير عام',admin:true,signed:true,licType:'master',picture,province:prevProvince,whatsapp:wa};
    S.role='ADMIN'; S.tab=0;
  } else if(isGarage){
    const gmProv=gmHit?((prov(gmHit.province)||{}).name||gmHit.province):(prevProvince||'بغداد');
    S.user={email,name:(gmHit&&gmHit.name)||name||'مسؤول الكراج',role:gmHit?`مدير كراج ${gmProv.split(' ')[0]}`:'مسؤول كراج — شريك النقل',admin:false,signed:true,licType:'garage',picture,province:gmProv,whatsapp:wa};
    S.role='GARAGE'; S.tab=0;
    setTimeout(()=>toast(`أهلاً بك — فُتحت لك لوحة كراج ${gmProv} 🏢`,'ok'),600);
  } else {
    S.user={email,name,role:prevLicType==='office'?'مكتب سفريات':role,admin:false,signed:true,licType:prevLicType||'customer',picture,province:prevProvince,whatsapp:wa};
    S.role=canSwitchDriver()&&role==='سائق'?'DRIVER':'PASSENGER'; S.tab=0;
  }
  saveState(); closeModal();
  toast(admin?'أهلاً مدير! تم التحقق من حسابك وتفعيل الصلاحيات العليا 👑':isGarage?`أهلاً ${name||'مسؤول الكراج'}! تم فتح لوحة الكراج 🏢`:`مرحباً ${name}! تم تسجيل الدخول عبر Google ✅`,'ok');
  enqueueSync(); render();
  // الموافقة على الشروط والأحكام إلزامية عند أول تسجيل
  setTimeout(requireTermsAcceptance, 500);
  // استأنف ما كان المستخدم يفعله قبل بوابة التسجيل (طلب سيارة مثلاً)
  if(_afterSignIn){ const f=_afterSignIn; _afterSignIn=null; setTimeout(()=>{ try{ f(); }catch(e){} }, 1200); }
}
/* ضغط صورة إلى أصغر حجم مع الحفاظ على وضوح القراءة
   - صورة الكابتن: 300px (وجه واضح، حجم صغير)
   - إجازة السوق: 900px بجودة أعلى (الكتابة تبقى مقروءة بأقل حجم ممكن) */
function compressImage(file, maxDim, quality, enhance){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        // تحسّس تلقائي للحجم: لا تكبير، فقط تصغير بما يحافظ على القراءة
        const scale=Math.min(1, maxDim/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d');
        ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,0,0,w,h);
        // تفتيح وتحسين إضاءة تلقائي (مدّ التباين) — للوثائق المصوّرة بإضاءة ضعيفة
        if(enhance){
          try{
            const id=ctx.getImageData(0,0,w,h), px=id.data;
            // حساب توزيع الإضاءة
            const hist=new Array(256).fill(0);
            for(let i=0;i<px.length;i+=4){
              hist[Math.round(0.299*px[i]+0.587*px[i+1]+0.114*px[i+2])]++;
            }
            const total=px.length/4, cut=total*0.01; // قصّ 1% من الأطراف
            let lo=0, acc=0; while(lo<255 && acc<cut){ acc+=hist[lo]; lo++; }
            let hi=255; acc=0; while(hi>0 && acc<cut){ acc+=hist[hi]; hi--; }
            if(hi-lo>20 && (lo>10 || hi<245)){ // حسّن فقط إن كانت الإضاءة ضعيفة فعلاً
              const range=hi-lo;
              for(let i=0;i<px.length;i+=4){
                px[i]  =Math.max(0,Math.min(255,(px[i]  -lo)*255/range));
                px[i+1]=Math.max(0,Math.min(255,(px[i+1]-lo)*255/range));
                px[i+2]=Math.max(0,Math.min(255,(px[i+2]-lo)*255/range));
              }
              ctx.putImageData(id,0,0);
            }
          }catch(e){ /* إن فشل التحسين تبقى الصورة الأصلية */ }
        }
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=r.result;
    };
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

];

DOC_KINDS.forEach(d=>_drvUploads[d.k]='');
async function pickDriverImage(kind, input){
  const file=input.files && input.files[0]; if(!file) return;
  try{
    // الإجازة بدقّة أعلى + تفتيح إضاءة تلقائي لتبقى الكتابة واضحة؛ الصورة الشخصية أصغر
    // المستمسكات بدقّة أعلى + تفتيح تلقائي لتبقى الكتابة مقروءة بأقل حجم تخزين
    const isDoc=kind!=='photo';
    const data = isDoc
      ? await compressImage(file, 900, 0.8, true)
      : await compressImage(file, 300, 0.82, false);
    _drvUploads[kind]=data;
    const kb=Math.round(data.length*0.75/1024);
    const prev=document.getElementById('prev-'+kind);
    if(prev) prev.innerHTML = isDoc
      ? `<img src="${data}" style="width:100%;max-height:160px;object-fit:contain;border-radius:10px;border:1px solid var(--border)"><div class="pill green" style="margin-top:6px">✓ مرفقة وواضحة · ${kb} KB</div>`
      : `<img src="${data}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)"><div class="pill green" style="margin-top:6px">✓ ${kb} KB</div>`;
  }catch(e){ toast('تعذّرت معالجة الصورة — جرّب صورة أخرى','err'); }
}

function doDriverRegister(){
  const name=document.getElementById('dr-name').value||'';
  const phone=document.getElementById('dr-phone').value||'';
  const car=document.getElementById('dr-car').value||'';
  const plate=document.getElementById('dr-plate').value||'';
  const province=document.getElementById('dr-prov').value;
  const vehType=document.getElementById('dr-vehtype').value;
  if(!name||!phone){ toast('أدخل الاسم ورقم الهاتف','err'); return; }
  const plateClass=(document.getElementById('dr-plateclass')||{}).value||'private';
  if(plateClass==='taxi' && !S.fin.allowTaxiPlates){ toast('🚫 الإدارة تعتمد سيارات الخصوصي فقط حالياً — لوحات الأجرة غير مسموحة','err'); return; }
  const existing=myDriver();
  // التسجيل الأول: إجازة السوق إلزامية
  if(!existing && !_drvUploads.license && REQ('licenseRequired')){ toast('🪪 صورة إجازة السوق إلزامية للتسجيل الأول','err'); return; }
  // كل المركبات مكيّفة إلزامياً عدا الدراجات
  const acRequired = vehType!=='moto';
  if(vehType==='vip'){
    const yearMatch=car.match(/20(2[2-9]|3[0-9])/);
    if(!yearMatch){ toast('⭐ خدمة VIP تشترط سيارة حديثة مميزة (موديل 2022 فأحدث) — اذكر الموديل والسنة','err'); return; }
  }
  if(existing){
    Object.assign(existing,{name,phone,car,plate,province,vehType,plateClass,ac:acRequired});
    if(_drvUploads.photo) existing.photo=_drvUploads.photo;
    DOC_KINDS.forEach(d=>{ if(_drvUploads[d.k]) existing[d.fld]=_drvUploads[d.k]; });
  } else {
    S.drivers.push({id:uid("drv"),email:S.user.email||'',name,phone,car,plate,rating:5.0,trips:0,online:true,
      queue:S.drivers.length+1,province,wallet:0,deposit:0,ac:acRequired,vehType,plateClass,
      photo:_drvUploads.photo||'', licenseVerified:false});
    const _nd=S.drivers[S.drivers.length-1];
    DOC_KINDS.forEach(d=>_nd[d.fld]=_drvUploads[d.k]||'');
  }
  // فعّل دور السائق للمستخدم
  if(S.user.signed){ S.user.licType=S.user.licType||'driver'; }
  saveState(); closeModal();
  toast(vehType==='vip'?'تم تسجيلك ككابتن VIP — بانتظار اعتماد الإدارة لسيارتك المميزة ⭐':'تم توثيق تسجيلك ككابتن — مرحباً بك في أسطول البُراق 🚖','ok');
  enqueueSync(); render();
}

/* نسبة عمولة خاصة بكابتن معيّن — أولويتها فوق نسبة الفئة (الماستر فقط) */
function setDriverComm(driverId, val){
  if(!isMaster()){ toast('هذه الصلاحية للمدير العام فقط','err'); return; }
  const d=S.drivers.find(x=>x.id===driverId); if(!d) return;
  if(val===''||val==null){ d.commPct=null; saveState(); toast('أُلغيت النسبة الخاصة — يُحاسَب بنسبة فئته','info'); render(); return; }
  const v=Math.max(0,Math.min(90,parseFloat(val)||0));
  d.commPct=v; saveState(); toast(`عمولة خاصة للكابتن ${d.name}: ${v}% 💼`,'ok'); render();
}

function doPayDebt(driverId, method){
  const d=S.drivers.find(x=>x.id===driverId);
  let amt=0, note='';
  if(method==='coupon'){
    const code=((document.getElementById('debt-coupon')||{}).value||'').trim().toUpperCase();
    const c=(S.coupons||[]).find(x=>x.code===code);
    if(!c){ toast('رمز القسيمة غير صحيح','err'); return; }
    if(c.status==='redeemed'){ toast('هذه القسيمة مُستخدَمة مسبقاً','err'); return; }
    if(c.status==='void'){ toast('هذه القسيمة مُلغاة','err'); return; }
    c.status='redeemed'; c.redeemedBy='تسديد ذمّة — '+(d?d.name:driverId); c.redeemedAt=nowTime();
    amt=c.amount; note=`قسيمة ${c.code}`;
  } else if(method==='wallet'){
    amt=parseInt((document.getElementById('debt-wamt')||{}).value)||0;
    if(amt<=0){ toast('أدخل مبلغاً صحيحاً','err'); return; }
    if(!d || (d.wallet||0)<amt){ toast('رصيد محفظتك لا يكفي لهذا المبلغ','err'); return; }
    d.wallet-=amt; note='خصم من محفظة الأرباح';
    S.transactions.unshift({id:uid("TX"),role:"سائق",title:"تسديد ذمّة من المحفظة",amount:amt,credit:false,time:"الآن",note:'ذمّة كاش'});
  } else { // transfer — تحويل رصيد، يُقبل أي مبلغ والزائد رصيد دائن
    amt=parseInt((document.getElementById('debt-amt')||{}).value)||0;
    if(amt<=0){ toast('أدخل مبلغ التحويل','err'); return; }
    note='تحويل/تعبئة رصيد';
  }
  const before=driverDebt(driverId);
  S.driverDebts[driverId]=before-amt; // تنزل الذمّة، والزائد يبقى رصيداً دائناً (قيمة سالبة)
  S.platformWallet=(S.platformWallet||0)+amt;
  S.ledger=S.ledger||[];
  S.ledger.unshift({id:uid('LG'),time:nowTime(),driverId,amount:amt,type:'settle',note:`تسديد ذمّة (${note})`});
  const after=driverDebt(driverId);
  saveState(); closeModal(); enqueueSync();
  const unblocked=before>debtCap()&&after<=debtCap();
  toast(`✅ سُدِّد ${fmt(amt)} د.ع (${note})${after<0?` — رصيدك الدائن ${fmt(-after)} د.ع`:''}${unblocked?' — أُعيد تفعيل الخدمة 🎉':''}`,'ok');
  render();
}

/* الترخيص */
function openActivate(){
  openModal(`<h3>🔑 تفعيل الترخيص</h3>
  <p class="t2" style="font-size:calc(12px*var(--fs))">الصق رابط التفعيل الموحّد الذي استلمته من المدير (يحتوي #go=).</p>
  <div class="field" style="margin-top:12px"><label>رابط التفعيل</label><textarea class="input" id="act-link" rows="3" placeholder="https://.../index.html#go=..."></textarea></div>
  <button class="btn btn-primary btn-block" onclick="doActivate()">تفعيل الآن</button>`);
}
async function doActivate(){
  const link=document.getElementById('act-link').value.trim();
  const m=link.match(/#go=([^.]+)\.([a-f0-9]+)/i);
  if(!m){ toast('رابط غير صالح — تأكّد من احتوائه على #go=','err'); return; }
  location.hash=m[0]; const res=await License.readHash();
  if(res&&res.valid){ applyLicense(res.data); closeModal(); toast('تم تفعيل الترخيص بنجاح ✓','ok'); render(); }
  else { toast(res&&res.expired?'انتهت صلاحية هذا الترخيص':'فشل التحقق من الترخيص','err'); }
}
function applyLicense(data){
  S.license={entity:data.entity,type:data.type,exp:data.exp,key:data.key};
  // ضبط الصلاحيات حسب نوع الترخيص
  const t=(data.type||'').trim();
  if(t==='كامل'||t==='إيجار شهري'){
    // مكتب سفريات: مسافر + سائق (بدون إدارة/تراخيص)
    S.user={email:data.key||'', name:data.entity||'مكتب', role:'مكتب سفريات', admin:false, signed:true, licType:'office'};
    S.role='PASSENGER'; S.tab=0;
  } else if(t==='فرعي — موظف'){
    // موظف: مسافر فقط (حجز + تتبّع + محفظة)
    S.user={email:data.key||'', name:data.entity||'موظف', role:'موظف', admin:false, signed:true, licType:'staff'};
    S.role='PASSENGER'; S.tab=0;
  } else if(t==='تجريبي'){
    // زبون عام: مسافر فقط
    S.user={email:data.key||'', name:data.entity||'مستخدم', role:'زبون', admin:false, signed:true, licType:'customer'};
    S.role='PASSENGER'; S.tab=0;
  }
  // المدير يبقى كما هو (لا يدخل من رابط تفعيل)
  saveState();
}
/* 👑 إيميلات الإدارة: ADMIN_EMAIL (الرئيسي) + ADMIN_EMAILS (قائمة أو نص مفصول بفواصل)
   + موظفو الإدارة الذين يضيفهم المدير من داخل التطبيق (S.fin.staff) */
function adminEmails(){
  const out=[];
  const push=v=>{ if(v&&typeof v==='string'){ v.split(/[,;\s]+/).forEach(x=>{ x=x.trim().toLowerCase(); if(x&&x.includes('@')&&!out.includes(x)) out.push(x); }); } };
  push(CONFIG.ADMIN_EMAIL);
  const multi=CONFIG.ADMIN_EMAILS;
  if(Array.isArray(multi)) multi.forEach(push); else push(multi);
  ((S.fin&&S.fin.staff)||[]).forEach(st=>push(st.email));
  return out;
}
function isAdminEmail(e){ return !!e && adminEmails().includes(String(e).toLowerCase()); }
/* المدير العام = الإيميل الرئيسي في config.js فقط (صلاحية عليا لا تُمنح لموظف) */
function isMaster(){ return S.user.admin && String(S.user.email||'').toLowerCase()===String(CONFIG.ADMIN_EMAIL||'').toLowerCase(); }
/* موظف إدارة = أي إيميل إداري آخر (يرى لوحة الإدارة بلا تعديل الإعدادات الحساسة) */
function isStaff(){ return S.user.admin && !isMaster(); }
function isRegisteredDriver(){ return !!myDriver(); }
function isGarageManager(){
  // مسؤول الكراج: شريك النقل (config.js) أو مدير محافظة سجّله الأدمن بإيميله
  const tm=(CONFIG.TRANSPORT_MANAGER_EMAIL||'').toLowerCase();
  const em=(S.user.email||'').toLowerCase();
  if(tm && em===tm) return true;
  if((S.user.licType||'')==='garage') return true;
  return !!myGarageAssignment();
}
/* تعيين مدير الكراج الحالي (إن كان الإيميل مسجلاً لدى الأدمن) */
function myGarageAssignment(){
  const em=(S.user.email||'').toLowerCase(); if(!em) return null;
  return ((S.fin&&S.fin.garageManagers)||[]).find(g=>(g.email||'').toLowerCase()===em)||null;
}
function canSwitchDriver(){ return isMaster() || (S.user.licType||'')==='office' || isRegisteredDriver(); }
function canSeeGarage(){ return isMaster() || isGarageManager(); }
function canSeeAdmin(){ return isMaster() || isStaff(); }
async function genLicense(){
  const entity=document.getElementById('lic-entity').value||'جهة بلا اسم';
  const type=document.getElementById('lic-type').value;
  const days=parseInt(document.getElementById('lic-days').value)||365;
  const key=(document.getElementById('lic-key').value||('SFR-'+Math.random().toString(36).slice(2,8).toUpperCase()+'-'+Date.now().toString(36).slice(-4).toUpperCase()));
  document.getElementById('lic-key').value=key;
  const exp=Date.now()+days*86400000;
  const url=await License.generate({entity,type,key,exp});
  document.getElementById('lic-out').innerHTML=`<div class="card soft">
    <div class="t2" style="font-size:calc(11px*var(--fs));margin-bottom:6px">رابط التفعيل الموحّد:</div>
    <div style="word-break:break-all;font-size:calc(11px*var(--fs));background:var(--bg);padding:10px;border-radius:10px;border:1px solid var(--border)">${url}</div>
    <div class="row" style="gap:8px;margin-top:10px">
      <button class="btn btn-primary btn-sm" style="flex:1" onclick="navigator.clipboard.writeText('${url}');toast('تم نسخ الرابط','ok')">📋 نسخ</button>
      <button class="btn btn-green btn-sm" onclick="shareLic('${url}','${entity}')">📨 واتساب</button>
    </div>
    <div class="muted" style="font-size:calc(10px*var(--fs));margin-top:8px">المفتاح: ${key} · النوع: ${type} · المدّة: ${days} يوم</div>
  </div>`;
  toast('تم توليد رابط التفعيل الموحّد 🔗','ok');
}
function shareLic(url,entity){
  const txt=`🚖 البُراق — رابط تفعيل التطبيق للجهة: ${entity}\n${url}`;
  const wa='https://wa.me/?text='+encodeURIComponent(txt);
  window.open(wa,'_blank');
}
